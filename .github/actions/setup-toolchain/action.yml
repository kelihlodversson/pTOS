#
# Install everything a pTOS build needs: the cross toolchain for one
# architecture, and the Python configuration front end.
#
# This is a composite action rather than a copy of the same steps in every
# job, because the build workflow and the release workflow both need it.
#

name: Set up a pTOS toolchain
description: Install a cross toolchain and the kconfiglib configuration front end.

inputs:
  arch:
    description: >
      Which cross toolchain to install: "m68k" for the Atari, Amiga and
      ColdFire targets, or "arm" for the Raspberry Pi ones.
    required: true
  mfastcall:
    description: >
      "true" to additionally install Thorsten Otto's m68k-atari-mintelf
      toolchain build ahead of the regular one on PATH, so that
      CONF_WITH_MFASTCALL=y configs (which need -mfastcall support neither
      of Vincent Riviere's toolchains has) can build. Ignored for arch:
      arm. Defaults to "false", so existing jobs are unaffected.
    required: false
    default: "false"

runs:
  using: composite

  steps:
    # A typo in a matrix entry would otherwise install nothing and fail much
    # later, in the middle of a build, with a confusing error.
    - name: Check the requested architecture
      shell: bash
      run: |
        case '${{ inputs.arch }}' in
        m68k|arm) ;;
        *)
          echo "::error::unknown arch '${{ inputs.arch }}', expected 'm68k' or 'arm'"
          exit 1
          ;;
        esac

        case '${{ inputs.mfastcall }}' in
        true|false) ;;
        *)
          echo "::error::mfastcall must be 'true' or 'false', got '${{ inputs.mfastcall }}'"
          exit 1
          ;;
        esac

    # Vincent Rivière's cross-mint packages are not part of Ubuntu itself, so
    # the m68k toolchain comes from his PPA.  This is why the jobs that build
    # m68k images pin an Ubuntu version the PPA actually has packages for,
    # instead of following ubuntu-latest.
    #
    # A second, separate PPA (vriviere/mintelf, not vriviere/ppa) provides
    # the ELF-based toolchain (m68k-atari-mintelf-*, install prefix distinct
    # from cross-mint-essential's a.out one, so both coexist without
    # conflict). It is the default m68k toolchain (Kconfig.machine), so a
    # default m68k build uses it unless the choice is overridden. It is
    # also the only toolchain that can produce the real ELF image
    # MACHINE_VIRT_M68K needs for QEMU's -kernel loader (emutos.ld forces
    # OUTPUT_FORMAT(elf32-m68k) for it, and the a.out toolchain's linker
    # has no elf32-m68k target compiled in at all). Installed
    # unconditionally for every m68k job regardless of which configs it
    # happens to build, rather than threading "does this job's matrix
    # include virt-m68k" through to this composite action.
    - name: Install the m68k cross toolchain
      if: inputs.arch == 'm68k'
      shell: bash
      run: |
        sudo add-apt-repository -y ppa:vriviere/ppa
        sudo add-apt-repository -y ppa:vriviere/mintelf
        sudo apt-get update -qq
        # dos2unix provides unix2dos, which "make release" uses to convert the
        # documentation in the archives to DOS line endings, and zip is what
        # packs each archive.  Both happen to be on the runner images already;
        # they are named here so that this action really is the whole list.
        sudo apt-get install -y cross-mint-essential cross-mintelf-essential dos2unix zip

    # CONF_WITH_MFASTCALL needs a GCC built with -mfastcall support, which
    # neither of Vincent Riviere's toolchains just installed above has (see
    # Kconfig.machine's CONF_WITH_MFASTCALL help text). Thorsten Otto
    # publishes a prebuilt m68k-atari-mintelf toolchain that does, at the
    # same executable names (m68k-atari-mintelf-gcc, -as, -ld, ...) as
    # Vincent Riviere's mintelf package above -- installed to its own
    # directory and prepended to PATH here, it simply takes over those
    # names for every later step in the job, no CROSS_COMPILE override
    # needed. binutils is a separate download from GCC on that site; both
    # extract a "usr/" tree, so unpacking them on top of each other merges
    # into one complete toolchain.
    #
    # The download URLs are version- and build-date-stamped (Thorsten
    # Otto's site keeps no "latest" alias), so a future toolchain update
    # there needs this step's URLs and hashes bumped by hand; the sha256
    # pin means a stale URL fails loudly here instead of silently building
    # against whatever the site happens to serve.
    - name: Install a -mfastcall capable m68k toolchain
      if: inputs.arch == 'm68k' && inputs.mfastcall == 'true'
      shell: bash
      env:
        GCC_URL: https://tho-otto.m68k.eu/download/mint/gcc-13.4.0-mintelf-20250702-bin-linux64.tar.xz
        GCC_SHA256: 70ae7f69ec54484b805990ddef517af13fccc3744018dbca3cc0e61eec1c55b6
        BINUTILS_URL: https://tho-otto.m68k.eu/download/mint/binutils-2.45-mintelf-20250812-bin-linux64.tar.xz
        BINUTILS_SHA256: e37c22f84baaf8ffc890a11265d4369498f9bc4e68aaac21dcef887d3655f025
      run: |
        dest="$RUNNER_TEMP/th-otto-mintelf"
        mkdir -p "$dest"

        for spec in "$GCC_URL:$GCC_SHA256" "$BINUTILS_URL:$BINUTILS_SHA256"; do
          url="${spec%:*}"
          sha256="${spec##*:}"
          archive="$RUNNER_TEMP/$(basename "$url")"

          curl -sSL --fail --retry 3 -o "$archive" "$url"
          echo "$sha256  $archive" | sha256sum -c -

          tar -xJf "$archive" -C "$dest"
          rm -f "$archive"
        done

        # This tarball ships the compiler and binutils only -- no C
        # library -- so its own bundled sys-root has nothing but the
        # libstdc++ headers GCC's build packages alongside itself, not
        # even <stdint.h>. A real, complete sys-root for this exact
        # target triple already exists on disk, installed by
        # cross-mintelf-essential above: reuse it instead of building
        # one, since the two toolchains share the target's C ABI.
        rm -rf "$dest/usr/m68k-atari-mintelf/sys-root"
        ln -s /usr/m68k-atari-mintelf/sys-root "$dest/usr/m68k-atari-mintelf/sys-root"

        echo "$dest/usr/bin" >>"$GITHUB_PATH"

    # A plain bare metal arm-none-eabi toolchain is all the Raspberry Pi
    # targets need, and Ubuntu packages one.
    - name: Install the ARM cross toolchain
      if: inputs.arch == 'arm'
      shell: bash
      run: |
        sudo apt-get update -qq
        # zip packs the Raspberry Pi kernels for a release.
        sudo apt-get install -y gcc-arm-none-eabi zip

    - name: Install Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # kconfiglib provides "make <name>_defconfig" and the menuconfig front
    # ends.  Nothing can be configured, and therefore built, without it.
    - name: Install kconfiglib
      shell: bash
      run: python3 -m pip install --disable-pip-version-check kconfiglib

    # Recorded in the log because a build that breaks only in CI is nearly
    # always a toolchain version difference.
    - name: Report the versions in use
      shell: bash
      run: |
        # Deliberately not "cmd | head -1".  head closes the pipe as soon as
        # it has its line, the writer then gets a write error, and the shell
        # runs with pipefail, so the step fails -- but only when the writer
        # loses the race, which makes it look like an unrelated flake.
        first_line() {
          local output
          output="$("$@" 2>&1)"
          printf '%s\n' "${output%%$'\n'*}"
        }

        first_line make --version
        first_line python3 --version
        python3 -c 'import kconfiglib; print("kconfiglib", kconfiglib.VERSION)'
        case '${{ inputs.arch }}' in
        m68k)
          first_line m68k-atari-mint-gcc --version
          echo "m68k-atari-mintelf-gcc: $(command -v m68k-atari-mintelf-gcc)"
          first_line m68k-atari-mintelf-gcc --version

          # Confirm the toolchain that just went first on PATH is the one
          # actually running, rather than only finding out via a Kconfig
          # capability-probe failure deep inside the real build.
          if [ '${{ inputs.mfastcall }}' = 'true' ]; then
            if ! echo 'void f(void){}' | m68k-atari-mintelf-gcc -mfastcall -x c -c - -o /dev/null 2>&1; then
              echo "::error::m68k-atari-mintelf-gcc does not support -mfastcall"
              exit 1
            fi
            echo "m68k-atari-mintelf-gcc supports -mfastcall"
          fi
          ;;
        arm)  first_line arm-none-eabi-gcc --version ;;
        esac
