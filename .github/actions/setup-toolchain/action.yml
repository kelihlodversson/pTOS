# Pinned GitHub Release packages on Linux; Homebrew SDKs on macOS.
name: Set up a pTOS toolchain
description: Install the packaged pTOS SDK and the Python configuration front end.

inputs:
  arch:
    description: 'SDK to install: m68k, arm, x86_64, or all.'
    required: true

runs:
  using: composite
  steps:
    - name: Install Linux host build tools
      if: runner.os == 'Linux'
      uses: ./.github/actions/apt-install
      with:
        packages: make gcc binutils zip dos2unix ca-certificates curl

    - name: Install macOS host build tools
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install make coreutils dos2unix
        echo "$(brew --prefix make)/libexec/gnubin" >>"$GITHUB_PATH"
        echo "$(brew --prefix coreutils)/libexec/gnubin" >>"$GITHUB_PATH"

    - name: Install the pTOS SDK packages
      shell: bash
      env:
        PTOS_ARCH: ${{ inputs.arch }}
      run: |
        options=()
        if [ "$RUNNER_OS" = Linux ]; then options=(--release); fi
        bash "$GITHUB_ACTION_PATH/../../../tools/install-ptos-toolchain.sh" "$PTOS_ARCH" "${options[@]}"

    - name: Install Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install kconfiglib
      shell: bash
      run: python3 -m pip install --disable-pip-version-check kconfiglib==14.1.0

    - name: Verify and report the installed compilers
      shell: bash
      env:
        PTOS_ARCH: ${{ inputs.arch }}
      run: |
        case "$PTOS_ARCH" in
          m68k) targets=(m68k-unknown-ptos-prgelf) ;;
          arm) targets=(arm-unknown-ptos-elf) ;;
          x86_64) targets=(x86_64-unknown-ptos-elfx32) ;;
          all) targets=(m68k-unknown-ptos-prgelf arm-unknown-ptos-elf x86_64-unknown-ptos-elfx32) ;;
          *) echo "::error::unknown SDK: $PTOS_ARCH"; exit 1 ;;
        esac
        make --version
        python3 --version
        python3 -c 'import kconfiglib; print("kconfiglib", kconfiglib.VERSION)'
        for target in "${targets[@]}"; do
          command -v "$target-gcc"
          "$target-gcc" --version
          "$target-ld" --version
          test "$("$target-gcc" -dumpmachine)" = "$target"
          case "$target" in
            m68k-*)
              echo 'void f(void){}' | "$target-gcc" -mfastcall -x c -c - -o /dev/null
              if [ "$RUNNER_OS" = Linux ]; then
                python3 /usr/share/doc/ptos-sdk-m68k/m68k_auto_inc_dec.py "$target-gcc"
              else
                tests="$(brew --prefix kelihlodversson/ptos-toolchain/ptos-m68k)/share/ptos-m68k/tests"
                python3 "$tests/m68k_auto_inc_dec.py" "$target-gcc"
              fi
              ;;
            x86_64-*)
              "$target-ld" -V | grep i386pep
              ;;
          esac
        done
