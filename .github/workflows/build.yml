#
# Ordinary build validation for pTOS.
#
# Every configuration in configs/ is built on its own, so that a change to
# shared code that breaks one machine says which machine it broke.  The m68k
# release archives are built too, because "make release" exercises code paths
# (all countries, the source archive, EmuCON) that a single image build does
# not.
#
# Publishing releases is deliberately not part of this workflow; see
# release.yml.
#

name: Build

# "epic/**" branches are long-lived integration branches for a multi-PR
# body of work (e.g. epic/329-x32-port): sub-issue PRs target one of these
# instead of master while the work is in progress, so they need the same
# CI coverage master's own PRs get, not just validation once the epic
# branch eventually merges to master.
on:
  push:
    branches: [master, "epic/**"]
  pull_request:
    branches: [master, "epic/**"]
  # every configuration, including those .github/pr-skip-configs leaves out of
  # a pull request, once a night
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

# Superseded runs of a pull request are of no interest.  Runs on master are
# left alone, so that every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  elf-shared-core:
    name: x32 ELF shared-library metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install the host and x32 test packages
        uses: ./.github/actions/apt-install
        with:
          packages: gcc-multilib qemu-system-x86 ovmf dosfstools mtools
      - name: Install the test tools for Python
        run: |
          python3 -m venv /tmp/elf-shared-venv
          /tmp/elf-shared-venv/bin/pip install kconfiglib==14.1.0
      - name: Test metadata, corrupt inputs and Kconfig isolation
        run: /tmp/elf-shared-venv/bin/python tools/test-elf-shared.py
      - name: Build the enabled freestanding x32 core
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          make pc-x86_64_defconfig
          CONFIG_= python - <<'PY'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          config.syms["CONF_WITH_ELF_SHARED"].set_value(2)
          config.write_config()
          PY
          make CROSS_COMPILE= obj/ldso/libldso.a
          ld -m elf32_x86_64 -r obj/ldso/dynamic.o obj/ldso/relocate.o obj/ldso/backend.o obj/ldso/graph.o obj/ldso/image.o obj/ldso/image_abi.o obj/ldso/image_plan.o obj/ldso/startup.o -o /tmp/ldso-core.o
          test -z "$(nm -u /tmp/ldso-core.o)"
      - name: Build and boot-test enabled mapping syscalls
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          make CROSS_COMPILE= -j2
          make CROSS_COMPILE= x32test x32-vdi-import-test x32-aes-import-test
          sh tools/test-mmap-boot.sh
      - name: Boot-test shared libraries with x32 AES, VDI and callbacks
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          CONFIG_= python - <<'PY'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          for name in ("CONF_WITH_X32_VDI", "CONF_WITH_X32_AES", "CONF_WITH_USER_CALLBACKS"):
              config.syms[name].set_value(2)
          config.write_config()
          PY
          make CROSS_COMPILE= -j2
          make CROSS_COMPILE= x32test x32-vdi-import-test x32-aes-import-test
          sh tools/test-mmap-boot.sh

      - name: Exercise shared desktop and console consumers
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          for variant in pc-x86_64-desktop-tests pc-x86_64-desktop-tests-builtin-cli; do
            make "$variant"_defconfig
            CONFIG_= python - <<'PY'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          config.syms["CONF_WITH_ELF_SHARED"].set_value(2)
          config.write_config()
          PY
            make CROSS_COMPILE= -j2
            make CROSS_COMPILE= x32-desktop-test x32-desktop-window-test
            readelf -l emudesk.prg | grep '/GEMSYS/LIB/X32/LD.SO'
            readelf -d emudesk.prg | grep 'libptos.so'
            if [ "$variant" = pc-x86_64-desktop-tests ]; then
              readelf -l cli/emucon.tos | grep '/GEMSYS/LIB/X32/LD.SO'
              readelf -d cli/emucon.tos | grep 'libptos.so'
              python3 tests/x32_desktop/run.py --output obj/shared-desktop-runtime
            else
              if readelf -l obj/x32/emucon.elf | grep 'INTERP'; then
                echo 'Embedded EmuCON must retain its static entry path' >&2
                exit 1
              fi
              python3 tests/x32_desktop/run.py --output obj/shared-desktop-builtin-cli --embedded-console --mode missing
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-x32-consumers
          path: |
            obj/shared-desktop-runtime/
            obj/shared-desktop-builtin-cli/
          if-no-files-found: ignore
          retention-days: 14


  # A few configurations to a job, one after the other (tools/ci-group.sh):
  # the job's own cost (a runner, the toolchain) is more than a
  # configuration's.  Every configuration is still an independent
  # compatibility check: one that fails does not stop the others, and is named
  # in the annotations and in the job's summary.
  build:
    name: build ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The configurations of a group are in .github/ci-configs
        include:
          - {group: m68k-atari, arch: m68k}
          - {group: m68k-amiga, arch: m68k}
          - {group: m68k-other, arch: m68k}
          - {group: arm-rpi, arch: arm}
          - {group: arm-virt, arch: arm}
    steps:
      # the configurations with CONF_WITH_VDI_SCALABLE_FONTS build lib/freetype
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: ${{ matrix.arch }}

      - name: Build the configurations
        run: tools/ci-group.sh "${{ matrix.group }}" tools/ci-build.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptos-${{ matrix.group }}
          path: products/
          retention-days: 14

  # The same for the x86-64 configurations, which also boot what they built
  # under QEMU and OVMF, or run the external desktop tests, and for the
  # regression suite of pc-x86_64, which builds pc-x86_64-desktop again
  # (tools/ci-x86_64.sh, tools/ci-regression.sh).
  x86_64:
    name: build ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: x86-boot-a}
          - {group: x86-boot-b}
          - {group: x86-desktop}
    steps:
      # the configurations with CONF_WITH_VDI_SCALABLE_FONTS build lib/freetype
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: x86_64

      # (the regression suite also wants the fonts of the gdos_answer suite:
      # see the regression job)
      - name: Install QEMU and OVMF
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 ovmf dosfstools mtools

      - name: Install the fonts
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends fonts-dejavu-core fonts-inter fonts-tlwg-loma-otf fonts-liberation

      - name: Install fontTools
        run: python3 -m pip install fonttools

      - name: Build and test the configurations
        run: tools/ci-group.sh "${{ matrix.group }}" tools/ci-x86_64.sh

      # The regression suite of pc-x86_64 (a desktop, started from
      # tests/emudesk.inf), after the configurations: it is its own check
      - name: Run the regression suite
        if: matrix.group == 'x86-desktop' && !cancelled()
        run: tools/ci-group.sh --names pc-x86_64 tools/ci-regression.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptos-${{ matrix.group }}
          path: products/
          retention-days: 14

  # The regression suite (tests/, `make test-dir`) under QEMU on the virt and
  # Raspberry Pi machines (tools/ci-regression.sh; the pc-x86_64 one is in the
  # x86_64 job above): the machines of an architecture to a job.
  regression:
    name: regression ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            machines: virt-arm virt-arm-traditional-fat raspi2b
            qemu: qemu-system-arm
          - arch: m68k
            machines: virt-m68k virt-m68k-fastcall
            qemu: qemu-system-misc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: ${{ matrix.arch }}

      - name: Install QEMU
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.qemu }} dosfstools mtools

      # scalable fonts for the gdos_answer suite: TrueType and CFF, one
      # whose ascender is taller than its em (Loma), and a monospaced one
      # with marks of no width (Liberation Mono); fontTools makes a TrueType
      # collection of two Liberation Sans faces
      - name: Install the fonts
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends fonts-dejavu-core fonts-inter fonts-tlwg-loma-otf fonts-liberation

      # for the interpreter the test script runs (setup-toolchain selects its
      # own Python, which the system's packages are not for)
      - name: Install fontTools
        run: python3 -m pip install fonttools

      - name: Run the regression suite
        run: tools/ci-group.sh --names "${{ matrix.machines }}" tools/ci-regression.sh

  release-archives:
    name: Release archives
    runs-on: ubuntu-latest
    steps:
      # release-emucon (part of "make release") builds against the
      # lib/libcmini submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      # Not a release: these archives are only kept as workflow artifacts, to
      # confirm that "make release" still works and to have something to
      # download from a build of master.  release.yml is what publishes.
      - name: Build the release archives
        run: |
          VERSION="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION"
          make release VERSION="$VERSION"
          ls -l release-archives

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-release-archives
          path: release-archives/
          retention-days: 14

  raspi-sdcard:
    name: Raspberry Pi SD card image
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The kernel images the arm-rpi job above already built for rpi1-4 --
      # rebuilding them here too would just double the wait.  The artifact
      # also holds rpi2-kproc, rpi2-sparse and rpi2-test, which are VDI and
      # test variants and not part of the SD card: they are not copied.
      - name: Collect the rpi1-4 kernel images
        uses: actions/download-artifact@v4
        with:
          name: ptos-arm-rpi
          path: raspi-build

      # mtools/dosfstools build the FAT16 partition and fdisk provides sfdisk
      # for the MBR, both without ever mounting or loop-attaching anything --
      # see tools/mkraspi-image.sh.  dos2unix provides unix2dos, which "make
      # release-raspi-resources" uses on the bundled text files, same as
      # every other pTOS release archive.  curl is what
      # tools/fetch-raspi-firmware.sh and tools/fetch-fonts.sh download with, listed explicitly
      # rather than assumed from the runner image.
      - name: Install SD card image tooling
        uses: ./.github/actions/apt-install
        with:
          packages: mtools dosfstools fdisk dos2unix curl zip

      - name: Fetch the Raspberry Pi boot firmware
        run: ./tools/fetch-raspi-firmware.sh sdcard/raspi-firmware

      # Not a release, so no version tag: a snapshot string identifies the
      # commit this artifact was built from, same as release-archives above.
      - name: Assemble the SD card contents
        run: |
          VERSION="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION"
          archive="ptos-raspi-$VERSION"
          mkdir -p "sdcard/$archive"

          cp raspi-build/rpi[1-4]/kernel*.img "sdcard/$archive"/
          cp sdcard/raspi-firmware/* "sdcard/$archive"/
          rm -r sdcard/raspi-firmware

          # The loadable mouse cursor and desktop icon resources, and a
          # readme.txt plus a doc/ subset -- the same optional extras every
          # other pTOS release archive carries, from release.mk.
          make release-raspi-resources DEST="sdcard/$archive" \
            RASPI_EMUCON=raspi-build/rpi2/emucon.tos \
            RASPI_EMUDESK=raspi-build/rpi2/emudesk.prg

          # The default scalable fonts (DejaVu, with their licence), which
          # the built-in GDOS finds in \GEMSYS\FONTS on the boot drive
          # without any configuration: tools/fetch-fonts.sh, pinned and
          # checked by checksum like the boot firmware.
          ./tools/fetch-fonts.sh "sdcard/$archive/GEMSYS/FONTS"

          ./tools/mkraspi-image.sh "sdcard/$archive" "sdcard/$archive.img"

          cd sdcard
          zip -9 -r "$archive.zip" "$archive" && rm -r "$archive"
          zip -9 "$archive.img.zip" "$archive.img" && rm "$archive.img"
          ls -l .

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-raspi-sdcard
          path: sdcard/
          retention-days: 14

  # A single job to require in the branch protection rules, so that the list
  # does not have to be edited every time a configuration is added.
  all-builds:
    name: All builds
    needs: [build, x86_64, regression, release-archives, raspi-sdcard]
    # Runs even when a configuration failed, which is the whole point, but not
    # when the run was cancelled: superseding a pull request run is normal, and
    # reporting the leftover as a failed build is just misleading.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The matrices are not worked out from configs/ (a job of its own for
      # a list that rarely changes): this fails when a configuration is not
      # in .github/ci-configs or the x86_64 matrix, so that none is left out.
      - name: Check that every configuration is built
        run: tools/check-ci-configs.sh

      - name: Check the results
        if: ${{ !cancelled() }}
        run: |
          echo "m68k and arm builds:   ${{ needs.build.result }}"
          echo "x86_64 configurations: ${{ needs.x86_64.result }}"
          echo "regression suite:      ${{ needs.regression.result }}"
          echo "release archives:      ${{ needs.release-archives.result }}"
          echo "raspi SD card image:   ${{ needs.raspi-sdcard.result }}"

          ok=true
          [ '${{ needs.build.result }}' = success ] || ok=false
          [ '${{ needs.x86_64.result }}' = success ] || ok=false
          [ '${{ needs.regression.result }}' = success ] || ok=false
          [ '${{ needs.release-archives.result }}' = success ] || ok=false
          [ '${{ needs.raspi-sdcard.result }}' = success ] || ok=false

          if ! $ok; then
            echo "::error::at least one required job failed (configuration build, regression suite, release archives or SD card image): see the results above"
            exit 1
          fi
