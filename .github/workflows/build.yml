#
# Ordinary build validation for pTOS.
#
# Every configuration in configs/ is built on its own, so that a change to
# shared code that breaks one machine says which machine it broke.  The m68k
# release archives are built too, because "make release" exercises code paths
# (all countries, the source archive, EmuCON) that a single image build does
# not.
#
# Publishing releases is deliberately not part of this workflow; see
# release.yml.
#

name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Superseded runs of a pull request are of no interest.  Runs on master are
# left alone, so that every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The matrices are derived from configs/ instead of being written out here,
  # so that adding a configuration automatically makes it a compatibility
  # check without anyone having to remember this file.
  configurations:
    name: Enumerate configurations
    runs-on: ubuntu-latest
    outputs:
      m68k: ${{ steps.enumerate.outputs.m68k }}
      arm: ${{ steps.enumerate.outputs.arm }}
    steps:
      - uses: actions/checkout@v4

      - name: Split the configurations by architecture
        id: enumerate
        run: |
          # ["rpi1","rpi2"] from a space separated list, [] when it is empty.
          # Written out by hand rather than with jq, so that this job needs
          # nothing beyond the shell.  A defconfig name never needs escaping.
          to_json() {
            local out= sep=
            for name in $1; do
              out="$out$sep\"$name\""
              sep=,
            done
            printf '[%s]' "$out"
          }

          m68k=
          arm=
          for config in configs/*_defconfig; do
            name=$(basename "$config" _defconfig)
            # MACHINE_RPI or MACHINE_VIRT_ARM is what selects the ARM
            # architecture; everything else in configs/ is m68k or ColdFire.
            if grep -qE '^MACHINE_(RPI|VIRT_ARM)=y' "$config"; then
              arm="$arm $name"
            else
              m68k="$m68k $name"
            fi
          done

          # One JSON array per architecture, for the matrices below.
          echo "m68k=$(to_json "$m68k")" >>"$GITHUB_OUTPUT"
          echo "arm=$(to_json "$arm")" >>"$GITHUB_OUTPUT"

          {
            echo '## Configurations to build'
            echo
            echo "m68k:$m68k"
            echo
            echo "arm:$arm"
          } >>"$GITHUB_STEP_SUMMARY"

  m68k:
    # The configuration name is the job name, so a failure is identified by
    # the entry in the checks list, without opening any logs.
    name: ${{ matrix.config }}
    needs: configurations
    # Pinned: the m68k toolchain comes from a PPA, which does not necessarily
    # have packages for whatever ubuntu-latest currently points at.
    runs-on: ubuntu-22.04
    strategy:
      # Every configuration is an independent compatibility check, so one
      # failure must not hide the state of the others.
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.configurations.outputs.m68k) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      - name: Build ${{ matrix.config }}
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          make "${CONFIG}_defconfig"
          make

      - name: Collect the build products
        run: |
          mkdir products
          # The name of the image depends on the configuration, so take
          # whatever the build produced rather than guessing.
          for product in *.img *.prg *.st *.s19 *.stc *.rom *.adf *.sym emutos.map; do
            if [ -e "$product" ]; then
              cp "$product" products/
            fi
          done
          ls -l products

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-${{ matrix.config }}
          path: products/
          retention-days: 14

      - name: Report the failure
        if: failure()
        run: |
          echo "::error title=${{ matrix.config }}::the ${{ matrix.config }} configuration failed"

  arm:
    name: ${{ matrix.config }}
    needs: configurations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.configurations.outputs.arm) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: arm

      - name: Build ${{ matrix.config }}
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          make "${CONFIG}_defconfig"
          make

      - name: Collect the build products
        run: |
          mkdir products
          # kernel.img, kernel7.img, kernel8-32.img or kernel7l.img, plus the
          # ELF the image was extracted from, which still has the symbols.
          for product in *.img emutos.elf emutos.map; do
            if [ -e "$product" ]; then
              cp "$product" products/
            fi
          done
          ls -l products

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-${{ matrix.config }}
          path: products/
          retention-days: 14

      - name: Report the failure
        if: failure()
        run: |
          echo "::error title=${{ matrix.config }}::the ${{ matrix.config }} configuration failed"

  release-archives:
    name: Release archives
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      # Not a release: these archives are only kept as workflow artifacts, to
      # confirm that "make release" still works and to have something to
      # download from a build of master.  release.yml is what publishes.
      - name: Build the release archives
        run: |
          VERSION="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION"
          make release VERSION="$VERSION"
          ls -l release-archives

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-release-archives
          path: release-archives/
          retention-days: 14

  raspi-sdcard:
    name: Raspberry Pi SD card image
    needs: [arm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The kernel images the arm matrix above already built for rpi1-4 --
      # rebuilding them here too would just double the wait.  rpi2-sparse is
      # a VDI test variant of rpi2, not part of the SD card; the pattern's
      # single-digit character class excludes it (and the virt-arm ones,
      # which are QEMU-only and have no kernel*.img at all).
      - name: Collect the rpi1-4 kernel images
        uses: actions/download-artifact@v4
        with:
          pattern: ptos-rpi[1-4]
          merge-multiple: true
          path: raspi-build

      # mtools/dosfstools build the FAT16 partition and fdisk provides sfdisk
      # for the MBR, both without ever mounting or loop-attaching anything --
      # see tools/mkraspi-image.sh.  dos2unix provides unix2dos, which "make
      # release-raspi-resources" uses on the bundled text files, same as
      # every other pTOS release archive.
      - name: Install SD card image tooling
        run: sudo apt-get update && sudo apt-get install -y mtools dosfstools fdisk dos2unix zip

      - name: Fetch the Raspberry Pi boot firmware
        run: ./tools/fetch-raspi-firmware.sh sdcard/raspi-firmware

      # Not a release, so no version tag: a snapshot string identifies the
      # commit this artifact was built from, same as release-archives above.
      - name: Assemble the SD card contents
        run: |
          VERSION="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION"
          archive="ptos-raspi-$VERSION"
          mkdir -p "sdcard/$archive"

          cp raspi-build/kernel*.img "sdcard/$archive"/
          cp sdcard/raspi-firmware/* "sdcard/$archive"/
          rm -r sdcard/raspi-firmware

          # The loadable mouse cursor and desktop icon resources, and a
          # readme.txt plus a doc/ subset -- the same optional extras every
          # other pTOS release archive carries, from release.mk.
          make release-raspi-resources DEST="sdcard/$archive"

          ./tools/mkraspi-image.sh "sdcard/$archive" "sdcard/$archive.img"

          cd sdcard
          zip -9 -r "$archive.zip" "$archive" && rm -r "$archive"
          zip -9 "$archive.img.zip" "$archive.img" && rm "$archive.img"
          ls -l .

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-raspi-sdcard
          path: sdcard/
          retention-days: 14

  # A single job to require in the branch protection rules, so that the list
  # does not have to be edited every time a configuration is added.
  all-builds:
    name: All builds
    needs: [m68k, arm, release-archives, raspi-sdcard]
    # Runs even when a configuration failed, which is the whole point, but not
    # when the run was cancelled: superseding a pull request run is normal, and
    # reporting the leftover as a failed build is just misleading.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        run: |
          echo "m68k configurations: ${{ needs.m68k.result }}"
          echo "arm configurations:  ${{ needs.arm.result }}"
          echo "release archives:    ${{ needs.release-archives.result }}"
          echo "raspi SD card image: ${{ needs.raspi-sdcard.result }}"
          case '${{ needs.m68k.result }}:${{ needs.arm.result }}:${{ needs.release-archives.result }}:${{ needs.raspi-sdcard.result }}' in
          success:success:success:success) ;;
          *)
            echo "::error::at least one configuration failed to build"
            exit 1
            ;;
          esac
