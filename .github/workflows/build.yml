#
# Ordinary build validation for pTOS.
#
# Every configuration in configs/ is built on its own, so that a change to
# shared code that breaks one machine says which machine it broke.  The m68k
# release archives are built too, because "make release" exercises code paths
# (all countries, the source archive, EmuCON) that a single image build does
# not.
#
# Publishing releases is deliberately not part of this workflow; see
# release.yml.
#

name: Build

# "epic/**" branches are long-lived integration branches for a multi-PR
# body of work (e.g. epic/329-x32-port): sub-issue PRs target one of these
# instead of master while the work is in progress, so they need the same
# CI coverage master's own PRs get, not just validation once the epic
# branch eventually merges to master.
on:
  push:
    branches: [master, "epic/**"]
  pull_request:
    branches: [master, "epic/**"]
  # every configuration, including those .github/pr-skip-configs leaves out of
  # a pull request, once a night
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

# Superseded runs of a pull request are of no interest.  Runs on master are
# left alone, so that every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Temporary: pin the build matrix until Ubuntu 26.04 compatibility is validated.
  elf-shared-core:
    name: x32 ELF shared-library metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
        with:
          arch: all
      - name: Install the host and x32 test packages
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 ovmf dosfstools mtools
      - name: Install the test tools for Python
        run: |
          python3 -m venv /tmp/elf-shared-venv
          /tmp/elf-shared-venv/bin/pip install kconfiglib==14.1.0
      - name: Test pinned SDK selection and checksum rejection
        run: python3 tools/test-toolchain-install.py
      - name: Test metadata, corrupt inputs and Kconfig isolation
        run: /tmp/elf-shared-venv/bin/python tools/test-elf-shared.py
      - name: Test executable handlers and interpreter arguments
        run: |
          sh tools/test-binfmt.sh
          BINFMT_SANITIZE=1 sh tools/test-binfmt.sh
          /tmp/elf-shared-venv/bin/python tools/test-binfmt-io.py
          BINFMT_SANITIZE=1 /tmp/elf-shared-venv/bin/python tools/test-binfmt-io.py
      - name: Test CUIS ownership and caller-local AES object contracts
        run: /tmp/elf-shared-venv/bin/python tools/test-cuis.py
      - name: Test AES context ownership and reentrancy with ASan and UBSan
        env:
          HOSTCC: cc -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie
        run: /tmp/elf-shared-venv/bin/python tools/test-cuis.py
      - name: Test bounded CUIS observer wait ownership (default off and gated)
        run: /tmp/elf-shared-venv/bin/python tools/test-cuis-observers.py
      - name: Test gated CUIS receipt runtime and canonical FIFO
        run: |
          /tmp/elf-shared-venv/bin/python tools/test-cuis-receipts.py
          /tmp/elf-shared-venv/bin/python tests/cuis/publication_receipt.py
          HOSTCC='gcc-13 -D_FORTIFY_SOURCE=3' /tmp/elf-shared-venv/bin/python tools/test-cuis-receipts.py
          HOSTCC='gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer' ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/elf-shared-venv/bin/python tools/test-cuis-receipts.py
      - name: Test reversible executable replacement admission
        run: |
          /tmp/elf-shared-venv/bin/python tools/test-exec-replacement.py
          HOSTCC="gcc-13 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" /tmp/elf-shared-venv/bin/python tools/test-exec-replacement.py
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 HOSTCC="gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer" /tmp/elf-shared-venv/bin/python tools/test-exec-replacement.py
      - name: Test retained PROCESS completion ownership
        run: /tmp/elf-shared-venv/bin/python tools/test-process-observer.py
      - name: Test exact SFT close ownership and bounded recovery
        run: /tmp/elf-shared-venv/bin/python tools/test-fs-close.py
      - name: Test coherent PROCESS descriptor snapshots and exact SFT ownership
        run: |
          /tmp/elf-shared-venv/bin/python tools/test-process-files.py
          HOSTCC='gcc-13 -D_FORTIFY_SOURCE=3 -fstack-protector-strong' /tmp/elf-shared-venv/bin/python tools/test-process-files.py
          HOSTCC='gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer' ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/elf-shared-venv/bin/python tools/test-process-files.py
      - name: Test PROCESS-owned launch rights
        run: /tmp/elf-shared-venv/bin/python tools/test-process-exec-handles.py
      - name: Test unpublished PROCESS dispatch and native-width ownership
        run: |
          /tmp/elf-shared-venv/bin/python tools/test-process-exec-dispatch.py
          HOSTCC="gcc-13 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" /tmp/elf-shared-venv/bin/python tools/test-process-exec-dispatch.py
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 HOSTCC="gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer" /tmp/elf-shared-venv/bin/python tools/test-process-exec-dispatch.py
      - name: Test production libaes CHILD adapter policy
        run: |
          /tmp/elf-shared-venv/bin/python tools/test-child-adapter.py
          HOSTCC="gcc-13 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" /tmp/elf-shared-venv/bin/python tools/test-child-adapter.py
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 HOSTCC="gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer" /tmp/elf-shared-venv/bin/python tools/test-child-adapter.py
      - name: Compile proposed GUI publication receipt layout
        run: X32CC=gcc-13 sh tools/check-publication-receipt-layout.sh x32
      - name: Execution cleanup guard ownership
        run: /tmp/elf-shared-venv/bin/python tools/test-cleanup-guard.py
      - name: Test PROCESS-owned PFS directory preparation and FAT cache lifetime
        run: |
          /tmp/elf-shared-venv/bin/python tools/test-process-search.py
          HOSTCC='gcc-13 -D_FORTIFY_SOURCE=3 -fstack-protector-strong' /tmp/elf-shared-venv/bin/python tools/test-process-search.py
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/elf-shared-venv/bin/python tools/test-process-search.py --sanitize
          /tmp/elf-shared-venv/bin/python tools/test-process-directory-pfs.py
          HOSTCC="gcc-13 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" /tmp/elf-shared-venv/bin/python tools/test-process-directory-pfs.py
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/elf-shared-venv/bin/python tools/test-process-directory-pfs.py --sanitize
      - name: Test regression worker log preservation
        run: python3 tools/test-testlib-log.py
      - name: Test clone ABI layout and pointer decoding
        run: sh tools/test-clone-abi.sh
      - name: Test transactional live-root procmem borrow rollback
        run: |
          /tmp/elf-shared-venv/bin/python tools/test-procmem-borrow.py
          HOSTCC="gcc-13 -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" /tmp/elf-shared-venv/bin/python tools/test-procmem-borrow.py
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 HOSTCC="gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer" /tmp/elf-shared-venv/bin/python tools/test-procmem-borrow.py
      - name: Test shared-exec permission, RELRO and startup preparation
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          for mode in normal asan fortified; do
            if [ "$mode" = fortified ]; then
              export HOSTCC=gcc-13
            else
              export HOSTCC=gcc
            fi
            /tmp/elf-shared-venv/bin/python tools/test-procmem-borrow.py --permissions --mode "$mode"
            /tmp/elf-shared-venv/bin/python tools/test-elf-bootstrap.py --mode "$mode"
            /tmp/elf-shared-venv/bin/python tools/test-kproc-runtime.py --mode "$mode"
            /tmp/elf-shared-venv/bin/python tools/test-kproc-runtime.py --image-policy --mode "$mode"
            /tmp/elf-shared-venv/bin/python tools/test-image-policy.py --mode "$mode"
            /tmp/elf-shared-venv/bin/python tools/test-image-policy.py --shared --mode "$mode"
          done
      - name: Test address-space ownership
        run: PATH=/tmp/elf-shared-venv/bin:$PATH sh tools/test-kaspace.sh
      - name: Test independent VM COW ownership and rollback
        run: |
          PATH=/tmp/elf-shared-venv/bin:$PATH sh tools/test-private-aspace.sh
          PATH=/tmp/elf-shared-venv/bin:$PATH HOSTCC="gcc-13 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" sh tools/test-private-aspace.sh
          PATH=/tmp/elf-shared-venv/bin:$PATH ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 HOSTCC="gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer" sh tools/test-private-aspace.sh
      - name: Test private captured reservation ownership and final conservation
        run: |
          /tmp/elf-shared-venv/bin/python tools/test-private-snapshot.py
          HOSTCC="gcc-13 -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" /tmp/elf-shared-venv/bin/python tools/test-private-snapshot.py
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 HOSTCC="gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer" /tmp/elf-shared-venv/bin/python tools/test-private-snapshot.py
      - name: Reproduce Phase6 production prerequisite contracts
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          /tmp/elf-shared-venv/bin/python tools/test-phase6.py
          /tmp/elf-shared-venv/bin/python tools/test-fork-parent.py
          HOSTCC="gcc-13 -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" /tmp/elf-shared-venv/bin/python tools/test-fork-parent.py
          HOSTCC="gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer" /tmp/elf-shared-venv/bin/python tools/test-fork-parent.py
          PATH=/tmp/elf-shared-venv/bin:$PATH HOSTCC="gcc-13 -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" sh tools/test-kaspace.sh
          PATH=/tmp/elf-shared-venv/bin:$PATH HOSTCC="gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer" sh tools/test-kaspace.sh
          HOSTCC="gcc-13 -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" /tmp/elf-shared-venv/bin/python tools/test-phase6.py
          HOSTCC="gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer" /tmp/elf-shared-venv/bin/python tools/test-phase6.py
          for capability in fs; do
            status=0
            /tmp/elf-shared-venv/bin/python tools/test-phase6.py --require "$capability" || status=$?
            test "$status" = 1 || { echo "expected verified prerequisite failure: $capability (got $status)"; exit 1; }
          done
          # Captured lazy authority in private clones is implemented (#971).
          /tmp/elf-shared-venv/bin/python tools/test-phase6.py --require lazy
      - name: Test Atari higher-half DMA translation
        run: python3 tools/test-atari-window.py
      - name: Build public Pfork/Pvfork without test transports
        run: PATH=/tmp/elf-shared-venv/bin:$PATH sh tools/check-pfork-build.sh
      - name: Build the enabled freestanding x32 core
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          make pc-x86_64_defconfig
          CONFIG_= python - <<'PY'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          config.syms["CONF_WITH_ELF_SHARED"].set_value(2)
          config.syms["CONF_WITH_PCLONE"].set_value(2)
          assert config.syms["CONF_WITH_PCLONE"].str_value == "y"
          config.write_config()
          PY
          make obj/ldso/libldso.a
          sh tools/test-clone-handler.sh
          HOSTCC="gcc-13 -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong" sh tools/test-clone-handler.sh
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 HOSTCC="gcc-13 -fsanitize=address,undefined -fno-omit-frame-pointer" sh tools/test-clone-handler.sh
          ld -m elf32_x86_64 -r obj/ldso/dynamic.o obj/ldso/relocate.o obj/ldso/backend.o obj/ldso/graph.o obj/ldso/image.o obj/ldso/image_abi.o obj/ldso/image_plan.o obj/ldso/startup.o -o /tmp/ldso-core.o
          test -z "$(nm -u /tmp/ldso-core.o)"
      - name: Build and boot-test enabled mapping syscalls
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          make -j2
          make x32test x32-vdi-import-test
          sh tools/test-mmap-boot.sh
      - name: Boot-test standard GEM shared libraries, VDI, callbacks and CUIS
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          CONFIG_= python - <<'PY'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          for name in ("CONF_WITH_X32_VDI", "CONF_WITH_USER_CALLBACKS", "CONF_WITH_LIBAES"):
              config.syms[name].set_value(2)
          config.write_config()
          PY
          make -j2
          make x32test x32-vdi-import-test
          readelf -d obj/libaes/CUIS.TOS | grep 'libaes.so'
          readelf -l obj/libaes/CUIS.TOS | grep '/GEMSYS/LIB/X32/LD.SO'
          python3 tools/check-libaes-elf.py obj/libaes/libaes.so obj/gemlib/libgem.a obj/libaes/GEM.TOS
          MMAP_BOOT_TIMEOUT=90 MMAP_BOOT_FORM_INPUT=1 sh tools/test-mmap-boot.sh

      - name: Boot-test gated PROCESS observer leases in CUIS waits
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          CONFIG_= python - <<'PY'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          for name in ("CONF_WITH_PCLONE", "CONF_WITH_PTHJOIN", "CONF_WITH_PTERMGRP"):
              config.syms[name].set_value(2)
              assert config.syms[name].str_value == "y"
          config.syms["CONF_WITH_CUIS_OBSERVER_TEST"].set_value(2)
          assert config.syms["CONF_WITH_CUIS_OBSERVER_TEST"].str_value == "y"
          config.write_config()
          PY
          make -j2
          MMAP_BOOT_TIMEOUT=90 MMAP_BOOT_FORM_INPUT=1 sh tools/test-mmap-boot.sh

      - name: Boot-test gated receipt runtime through real PROCESS and CUIS rings
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          CONFIG_= python - <<'PY'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          config.syms["CONF_WITH_CUIS_RECEIPT_TEST"].set_value(2)
          assert config.syms["CONF_WITH_CUIS_RECEIPT_TEST"].str_value == "y"
          config.write_config()
          PY
          make -j2
          MMAP_BOOT_TIMEOUT=90 MMAP_BOOT_FORM_INPUT=1 sh tools/test-mmap-boot.sh

      - name: Boot-test private clone and independent CUIS observation
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          CONFIG_= python - <<'PY'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          for name in ("CONF_WITH_NATIVE_SCHED", "CONF_WITH_PCLONE", "CONF_WITH_PTHJOIN", "CONF_WITH_PTERMGRP",
                       "CONF_WITH_PRIVATE_CLONE", "CONF_WITH_PRIVATE_CLONE_TEST",
                       "CONF_WITH_IMAGE_POLICY"):
              config.syms[name].set_value(2)
              assert config.syms[name].str_value == "y", name
          config.write_config()
          PY
          make -j2 all x32test x32-vdi-import-test
          MMAP_BOOT_TIMEOUT=300 MMAP_BOOT_FORM_INPUT=1 sh tools/test-mmap-boot.sh

      - name: Boot-test ownership with eager managed scheduling
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          make pc-x86_64-eager_defconfig
          CONFIG_= python - <<'PYCONFIG'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          for name in ("CONF_WITH_X86_64_MEMTEST", "CONF_WITH_NATIVE_SCHED", "CONF_WITH_PCLONE", "CONF_WITH_PTHJOIN", "CONF_WITH_PTERMGRP"):
              config.syms[name].set_value(2)
              assert config.syms[name].str_value == "y"
          assert config.syms["CONF_WITH_DEMAND_PAGING"].str_value == "n"
          assert config.syms["CONF_WITH_MMAP"].str_value == "n"
          config.write_config()
          PYCONFIG
          make -j2 all x32test
          sh tools/test-mmap-boot.sh --disabled

      # (the shared desktop and console consumers, pc-x86_64-desktop-tests and
      # its built-in-cli variant, are built and run by the x86-desktop group:
      # tools/ci-x86_64.sh)

  # A few configurations to a job, one after the other (tools/ci-group.sh):
  # the job's own cost (a runner, the toolchain) is more than a
  # configuration's.  Every configuration is still an independent
  # compatibility check: one that fails does not stop the others, and is named
  # in the annotations and in the job's summary.
  build:
    name: build ${{ matrix.group }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The configurations of a group are in .github/ci-configs
        include:
          - {group: m68k-amiga, arch: m68k}
          - {group: m68k-other, arch: m68k}
          - {group: arm-rpi, arch: arm}
          - {group: arm-virt, arch: arm}
    steps:
      # the configurations with CONF_WITH_VDI_SCALABLE_FONTS build lib/freetype
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: ${{ matrix.arch }}

      - name: Check clone user ABI layout
        if: matrix.group == 'arm-virt' || matrix.group == 'm68k-other'
        run: sh tools/check-clone-layout.sh "${{ matrix.arch }}"

      - name: Build the configurations
        run: tools/ci-group.sh "${{ matrix.group }}" tools/ci-build.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptos-${{ matrix.group }}
          path: products/
          retention-days: 14

  # The Atari configurations, in a job of their own: the Hatari and pBench
  # jobs take their systems, test disks and pBench from its artifact (#987),
  # and wait for this job only (needs: cannot name one entry of a matrix, and
  # waiting for all of "build" kept them waiting for its slowest group).
  build-atari:
    name: build ${{ matrix.group }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The configurations of a group are in .github/ci-configs
        include:
          - {group: m68k-atari, arch: m68k}
    steps:
      # the configurations with CONF_WITH_VDI_SCALABLE_FONTS build lib/freetype
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: ${{ matrix.arch }}

      # mkfs.fat and mtools make the Hatari test disks (tools/mkhdisk.sh),
      # which tools/ci-build.sh makes for the Hatari jobs below
      - name: Install the disk image tools
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends dosfstools mtools

      - name: Build the configurations
        run: tools/ci-group.sh "${{ matrix.group }}" tools/ci-build.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptos-${{ matrix.group }}
          path: products/
          retention-days: 14

  # The same for the x86-64 configurations, which also boot what they built
  # under QEMU and OVMF, or run the external desktop tests, and for the
  # regression suite of pc-x86_64, which builds pc-x86_64-desktop again
  # (tools/ci-x86_64.sh, tools/ci-regression.sh).
  x86_64:
    name: build ${{ matrix.group }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: x86-boot-a}
          - {group: x86-boot-b}
          - {group: x86-desktop}
    steps:
      # the configurations with CONF_WITH_VDI_SCALABLE_FONTS build lib/freetype
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: x86_64

      # (the regression suite also wants the fonts of the gdos_answer suite:
      # see the regression job)
      - name: Install QEMU and OVMF
        uses: ./.github/actions/apt-install
        with:
          packages: qemu-system-x86 ovmf dosfstools mtools

      - name: Install the fonts
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends fonts-dejavu-core fonts-inter fonts-tlwg-loma-otf fonts-liberation

      - name: Install fontTools
        run: python3 -m pip install fonttools

      - name: Build and test the configurations
        run: tools/ci-group.sh "${{ matrix.group }}" tools/ci-x86_64.sh

      # The regression suite of pc-x86_64 (a desktop, started from
      # tests/emudesk.inf), after the configurations: it is its own check
      - name: Run the regression suite
        if: matrix.group == 'x86-desktop' && !cancelled()
        run: tools/ci-group.sh --names pc-x86_64 tools/ci-regression.sh

      - name: Run native executable-handler boot tests
        if: matrix.group == 'x86-desktop' && !cancelled()
        run: tools/ci-binfmt.sh x32

      - uses: actions/upload-artifact@v4
        if: always() && matrix.group == 'x86-desktop'
        with:
          name: binfmt-x32
          path: |
            obj/binfmt/x32/*.log
            obj/binfmt/x32/test.json
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ptos-${{ matrix.group }}
          path: products/
          retention-days: 14

  # The regression suite (tests/, `make test-dir`) under QEMU on the virt and
  # Raspberry Pi machines (tools/ci-regression.sh; the pc-x86_64 one is in the
  # x86_64 job above): the machines of an architecture to a job.
  regression:
    name: regression ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm
            machines: virt-arm virt-arm-traditional-fat raspi2b virt-arm-aspace raspi2b-aspace
            qemu: qemu-system-arm
          - arch: m68k
            machines: virt-m68k virt-m68k-fastcall virt-m68k-mmu virt-m68k-aspace virt-m68k-aspace-defconfig
            qemu: qemu-system-misc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: ${{ matrix.arch }}

      - name: Install QEMU
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.qemu }} dosfstools mtools

      # scalable fonts for the gdos_answer suite: TrueType and CFF, one
      # whose ascender is taller than its em (Loma), and a monospaced one
      # with marks of no width (Liberation Mono); fontTools makes a TrueType
      # collection of two Liberation Sans faces
      - name: Install the fonts
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends fonts-dejavu-core fonts-inter fonts-tlwg-loma-otf fonts-liberation

      - name: Test ARM saved-return routing and admission
        if: matrix.arch == 'arm'
        run: python3 tools/test-fork-return-arm.py

      # for the interpreter the test script runs (setup-toolchain selects its
      # own Python, which the system's packages are not for)
      - name: Install fontTools
        run: python3 -m pip install fonttools

      - name: Run the regression suite
        run: tools/ci-group.sh --names "${{ matrix.machines }}" tools/ci-regression.sh

      - name: Run native executable-handler boot tests
        if: ${{ !cancelled() }}
        run: |
          tools/ci-binfmt.sh '${{ matrix.arch }}'
          if [ '${{ matrix.arch }}' = arm ]; then tools/ci-binfmt.sh arm shared; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binfmt-${{ matrix.arch }}
          path: |
            obj/binfmt/${{ matrix.arch }}*/*.log
            obj/binfmt/${{ matrix.arch }}*/test.json
          retention-days: 14

  exec-replacement-native:
    name: private ELF staging ${{ matrix.machine }} ${{ matrix.fs }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, machine: pc-x86_64, fs: fat, qemu: qemu-system-x86}
          - {arch: arm, machine: virt-arm-aspace, fs: fat, qemu: qemu-system-arm}
          - {arch: arm, machine: virt-arm-aspace, fs: pfs, qemu: qemu-system-arm}
          - {arch: m68k, machine: virt-m68k-aspace, fs: fat, qemu: qemu-system-misc}
          - {arch: m68k, machine: virt-m68k-aspace, fs: pfs, qemu: qemu-system-misc}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
        with:
          arch: ${{ matrix.arch }}
      - uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.qemu }} ovmf dosfstools mtools fonts-dejavu-core fonts-inter fonts-tlwg-loma-otf fonts-liberation
      - name: Install fontTools
        run: python3 -m pip install fonttools
      - name: Stage ELF images and exercise same-image NORETURN transport
        env:
          EXEC_REPLACEMENT_TEST: '1'
          EXEC_HANDOFF_TEST: '1'
          EXEC_STAGING_PROFILE: '1'
          # 68k MMU only (#1018): ARM/x32 have no shared-VM Pexec.
          SHARED_VM_PEXEC: ${{ matrix.arch == 'm68k' && '1' || '0' }}
          SHARED_VM_PEXEC_FS: ${{ matrix.fs }}
        run: tools/ci-regression.sh "${{ matrix.machine }}"

  process-files:
    name: PROCESS descriptors ${{ matrix.machine }} ${{ matrix.fs }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, machine: pc-x86_64, fs: fat, qemu: qemu-system-x86 ovmf}
          - {arch: arm, machine: virt-arm-aspace, fs: fat, qemu: qemu-system-arm}
          - {arch: arm, machine: virt-arm-aspace, fs: pfs, qemu: qemu-system-arm}
          - {arch: m68k, machine: virt-m68k-aspace, fs: fat, qemu: qemu-system-misc}
          - {arch: m68k, machine: virt-m68k-aspace, fs: pfs, qemu: qemu-system-misc}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
        with:
          arch: ${{ matrix.arch }}
      - uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.qemu }} dosfstools mtools fonts-dejavu-core fonts-inter fonts-tlwg-loma-otf fonts-liberation
      - name: Install fontTools
        run: python3 -m pip install fonttools
      - name: Run real-trap descriptor ownership and complete regression/shutdown checks
        env:
          EXEC_REPLACEMENT_TEST: '1'
          EXEC_HANDOFF_TEST: '1'
          PROCESS_FILES_TEST: '1'
          PROCESS_FILES_FS: ${{ matrix.fs }}
          REGRESSION_RAW_DISK: '1'
        run: tools/ci-group.sh --names "${{ matrix.machine }}" tools/ci-regression.sh

  hatari-preemption:
    name: Native 68040 timer preemption on Hatari
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k
      - uses: ./.github/actions/setup-hatari
      - uses: ./.github/actions/apt-install
        with:
          packages: dosfstools mtools
      - name: Install TT screen reader
        run: python3 -m pip install pillow
      - name: Run production timer policy on Falcon and TT 040
        run: |
          git show -s --format='source %H%nparents %P' HEAD
          tools/ci-hatari-preemption.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hatari-preemption-logs
          path: |
            logs/*
            obj/auto.conf
          retention-days: 14

  native-preemption:
    name: Native timer preemption ${{ matrix.machine }} ${{ matrix.fs }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, machine: pc-x86_64, fs: fat, qemu: qemu-system-x86 ovmf}
          - {arch: arm, machine: virt-arm-aspace, fs: fat, qemu: qemu-system-arm}
          - {arch: arm, machine: virt-arm-aspace, fs: pfs, qemu: qemu-system-arm}
          - {arch: m68k, machine: virt-m68k-aspace, fs: fat, qemu: qemu-system-misc}
          - {arch: m68k, machine: virt-m68k-aspace, fs: pfs, qemu: qemu-system-misc}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
        with:
          arch: ${{ matrix.arch }}
      - uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.qemu }} dosfstools mtools fonts-dejavu-core fonts-inter fonts-tlwg-loma-otf fonts-liberation
      - name: Install fontTools
        run: python3 -m pip install fonttools
      - name: Exercise production timer policy and retained USER returns
        env:
          NATIVE_PREEMPT: '1'
          EXEC_REPLACEMENT_TEST: '1'
          EXEC_HANDOFF_TEST: '1'
          PROCESS_FILES_TEST: '1'
          PROCESS_FILES_FS: ${{ matrix.fs }}
          SHARED_VM_PEXEC: ${{ matrix.arch == 'm68k' && '1' || '0' }}
          SHARED_VM_PEXEC_FS: ${{ matrix.fs }}
          REGRESSION_RAW_DISK: '1'
        run: |
          set -o pipefail
          git show -s --format='source %H%nparents %P' HEAD | tee native-preemption.log
          tools/ci-regression.sh "${{ matrix.machine }}" 2>&1 | tee -a native-preemption.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-preemption-${{ matrix.machine }}-${{ matrix.fs }}
          path: |
            native-preemption.log
            obj/auto.conf
            obj/autoconf.h
          retention-days: 14

  release-archives:
    name: Release archives
    runs-on: ubuntu-24.04
    steps:
      # release-emucon (part of "make release") builds against the
      # lib/libcmini submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      # Not a release: these archives are only kept as workflow artifacts, to
      # confirm that "make release" still works and to have something to
      # download from a build of master.  release.yml is what publishes.
      - name: Build the release archives
        run: |
          VERSION="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION"
          make release VERSION="$VERSION"
          ls -l release-archives

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-release-archives
          path: release-archives/
          retention-days: 14

  raspi-sdcard:
    name: Raspberry Pi SD card image
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The kernel images the arm-rpi job above already built for rpi1-4 --
      # rebuilding them here too would just double the wait.  The artifact
      # also holds rpi2-kproc, rpi2-sparse and rpi2-aspace, which are VDI and
      # test variants and not part of the SD card: they are not copied.
      - name: Collect the rpi1-4 kernel images
        uses: actions/download-artifact@v4
        with:
          name: ptos-arm-rpi
          path: raspi-build

      # mtools/dosfstools build the FAT16 partition and fdisk provides sfdisk
      # for the MBR, both without ever mounting or loop-attaching anything --
      # see tools/mkraspi-image.sh.  dos2unix provides unix2dos, which "make
      # release-raspi-resources" uses on the bundled text files, same as
      # every other pTOS release archive.  curl is what
      # tools/fetch-raspi-firmware.sh and tools/fetch-fonts.sh download with, listed explicitly
      # rather than assumed from the runner image.
      - name: Install SD card image tooling
        uses: ./.github/actions/apt-install
        with:
          packages: mtools dosfstools fdisk dos2unix curl zip

      - name: Fetch the Raspberry Pi boot firmware
        run: ./tools/fetch-raspi-firmware.sh sdcard/raspi-firmware

      # Not a release, so no version tag: a snapshot string identifies the
      # commit this artifact was built from, same as release-archives above.
      - name: Assemble the SD card contents
        run: |
          VERSION="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION"
          archive="ptos-raspi-$VERSION"
          mkdir -p "sdcard/$archive"

          cp raspi-build/rpi[1-4]/kernel*.img "sdcard/$archive"/
          cp sdcard/raspi-firmware/* "sdcard/$archive"/
          rm -r sdcard/raspi-firmware

          # The loadable mouse cursor and desktop icon resources, and a
          # readme.txt plus a doc/ subset -- the same optional extras every
          # other pTOS release archive carries, from release.mk.
          make release-raspi-resources DEST="sdcard/$archive" \
            RASPI_EMUCON=raspi-build/rpi2/emucon.tos \
            RASPI_EMUDESK=raspi-build/rpi2/emudesk.prg

          # The default scalable fonts (DejaVu, with their licence), which
          # the built-in GDOS finds in \GEMSYS\FONTS on the boot drive
          # without any configuration: tools/fetch-fonts.sh, pinned and
          # checked by checksum like the boot firmware.
          ./tools/fetch-fonts.sh "sdcard/$archive/GEMSYS/FONTS"

          ./tools/mkraspi-image.sh "sdcard/$archive" "sdcard/$archive.img"

          cd sdcard
          zip -9 -r "$archive.zip" "$archive" && rm -r "$archive"
          zip -9 "$archive.img.zip" "$archive.img" && rm "$archive.img"
          ls -l .

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-raspi-sdcard
          path: sdcard/
          retention-days: 14

  # Positive shared-Pexec evidence is separate from the gate-off compatibility
  # jobs. The runner requires the configured user-trap assertion markers.
  shared-pexec:
    name: shared Pexec ${{ matrix.machine }} ${{ matrix.fs }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # 68k compatibility only (#1018)
          - { arch: m68k, machine: virt-m68k-aspace, fs: fat, qemu: qemu-system-misc }
          - { arch: m68k, machine: virt-m68k-aspace, fs: pfs, qemu: qemu-system-misc }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
        with:
          arch: ${{ matrix.arch }}
      - uses: ./.github/actions/apt-install
        with:
          packages: ${{ matrix.qemu }} dosfstools mtools fonts-dejavu-core fonts-inter fonts-tlwg-loma-otf fonts-liberation
      - name: Install fontTools
        run: python3 -m pip install fonttools
      - name: Execute positive shared-VM traps and shutdown checks
        run: |
          set -o pipefail
          sh tools/ci-shared-pexec.sh '${{ matrix.machine }}' '${{ matrix.fs }}' 2>&1 | tee shared-pexec.log
      - name: Record exact source and effective configuration
        if: always()
        run: |
          git rev-parse HEAD > shared-pexec-source.txt
          cp .config shared-pexec.config
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-pexec-${{ matrix.machine }}-${{ matrix.fs }}
          path: |
            shared-pexec.log
            shared-pexec-source.txt
            shared-pexec.config
            build.log
          retention-days: 14

  homebrew:
    name: Homebrew SDKs and builds (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-toolchain
        with:
          arch: all
      - name: Test all installed SDKs together
        run: |
          for formula in ptos-m68k ptos-arm ptos-x86_64; do
            brew test "kelihlodversson/ptos-toolchain/$formula"
          done
      - name: Build m68k, ARM and UEFI with the default prefixes
        run: |
          for config in virt-m68k-aspace virt-arm-aspace pc-x86_64; do
            make distclean
            make "${config}_defconfig"
            make -j3
            make -j3 runtests.tos
          done

  # The regression tests under Hatari (tests/, doc in tests/readme.md): the
  # test disk on an emulated STE in the ST screen modes, a Falcon with a 68030
  # and with a 68040, and a TT, the MMU ones with the MMU on.  The combinations
  # are in groups, a job each (tools/ci-hatari.sh): a run takes from seconds
  # to twenty minutes, and on the four CPUs of one runner they queued for half
  # an hour.  A group of a pull request has at most four, which start at once.
  # The systems and their test disks are the ones "build m68k-atari" built
  # (tools/ci-build.sh, #987): nothing is built here.  The Hatari is the pinned
  # build of tools/hatari-pin.sh: the 2.4.1 of the 24.04 package hangs the
  # 68030 address-space runs (#727, #737), and the 2.6.1 of the 26.04 one lacks
  # the 68030 MMU fixes of 2026 (#805).  The two blitter suites (text_blit and
  # raster_copy) compare the blitter with the CPU path pixel by pixel, and have
  # to run, not skip themselves, where there is a blitter; the Falcon is the
  # one with a data cache.  A pull request runs some of the combinations,
  # chosen from what depends on the mode and on the kernel (doc/ci.txt); the
  # nightly and manual runs all of them; a push none.
  hatari:
    name: Hatari ${{ matrix.group }}
    needs: [build-atari]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # the groups of tools/ci-hatari.sh (its --check compares them)
        group: ${{ fromJSON(github.event_name == 'pull_request' && '["st","variants","mmu"]' || '["st","fastcall","kproc","extdesk","mmu"]') }}
    steps:
      - uses: actions/checkout@v4

      # the Hatari of tools/hatari-pin.sh, built once and cached (#807)
      - uses: ./.github/actions/setup-hatari

      - name: Report the Hatari version
        run: hatari --version || true     # (it exits with 1)

      # the TT mode reads the screen (tools/run-hatari-tests.py)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install the screen reader of the TT mode
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Collect the systems and test disks
        uses: actions/download-artifact@v4
        with:
          name: ptos-m68k-atari
          path: products

      # A run takes three to eleven minutes on a quiet runner (the 68040 ones
      # are the longest), twice that on a busy one; forty is for one that hangs
      # (#820), well below the job's time.
      - name: Run the tests under Hatari
        env:
          EVENT: ${{ github.event_name }}
        run: tools/ci-hatari.sh --group "${{ matrix.group }}"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatari-logs-${{ matrix.group }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

  # One check for the branch protection, under the name the single job had,
  # whatever the groups are.  Not part of "All builds".
  hatari-tests:
    name: Hatari tests
    needs: [hatari]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the groups run every combination once
        run: tools/ci-hatari.sh --check

      - name: Check the results
        run: |
          echo "Hatari groups: ${{ needs.hatari.result }}"
          if [ '${{ needs.hatari.result }}' != success ]; then
            echo "::error::at least one Hatari group failed, or did not run: see the jobs \"Hatari GROUP\" (and \"build m68k-atari\", which builds their systems)"
            exit 1
          fi

  # Performance check: pBench (tools/pBench, doc/pbench.txt) under Hatari,
  # compared with the baseline kept in the repository.  A change that makes
  # the graphics significantly slower fails the check; one that makes them
  # significantly faster gets a comment on the pull request, so that the
  # improvement is noticed and the baseline moved up on purpose.  Only Hatari
  # is used: its clock is the emulated one, so the numbers do not depend on
  # the runner (QEMU's do).  The three systems and pBench are the ones "build
  # m68k-atari" built (tools/ci-build.sh, #987); they are measured one after
  # the other, each against its own baseline, with its own comment.  Hatari
  # comes from the distribution's packages: the runner is an Ubuntu 26.04, for
  # its Hatari 2.6 (the baselines are made with it).  Pull requests and manual
  # runs only.
  pbench:
    name: pBench
    needs: [build-atari]
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Hatari
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends hatari

      - name: Report the Hatari version
        run: hatari --version || true     # (it exits with 1)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Collect the systems and pBench
        uses: actions/download-artifact@v4
        with:
          name: ptos-m68k-atari
          path: products

      # A mode that gave no result is reported by the comparison, which still
      # has to run (and fail the job) so that the report, the summary and the
      # comment are not lost.  A run takes half a minute; one that hangs is
      # given two minutes, three tries, in two waves of five.  The screen
      # modes (see run-baselines.py --res): the ST modes of every
      # configuration, and an emulated Falcon with a 68030 and with a 68040
      # for the one whose ROM image runs on it.
      - name: Measure and compare
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          # a pull request from a fork has a read-only token, so there the
          # summary is all there is
          CAN_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          slower=
          for entry in atari512:low,med,high,f030,f040 atari256:low,med,high atari512-fastcall:f030,f040; do
            config=${entry%%:*}
            modes=${entry#*:}
            echo "::group::$config"
            python3 tools/pBench/run-baselines.py \
              --pbench "products/$config/pbench.prg" --out results --jobs 5 --timeout 120 \
              --res "$modes" \
              --system "${config}=products/$config/system.img=pTOS ${config} (${GITHUB_SHA::8})" || true
            # The results as text too, so that baselines can be made from the
            # log when the artifact cannot be had (no -mfastcall toolchain to
            # make them with locally either)
            for f in results/${config}-*.txt; do
              [ -e "$f" ] || continue
              echo "== $f"
              cat "$f"
            done
            echo "::endgroup::"

            # 0 as the baseline, 1 slower (or no result), 2 faster
            rc=0
            python3 tools/pBench/check-baseline.py --report "report-$config.md" \
              tools/pBench/ci-baselines results "$config" || rc=$?
            cat "report-$config.md" >>"$GITHUB_STEP_SUMMARY"
            [ "$rc" != 1 ] || slower="$slower $config"

            # Update the comment this job made on an earlier push, or make one
            # when there is something to say: a significant change, in either
            # direction.
            if [ "$CAN_COMMENT" = true ]; then
              marker="<!-- pbench-check:${config} -->"
              id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                     --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
              if [ -n "$id" ] || [ "$rc" != 0 ]; then
                { echo "$marker"; cat "report-$config.md"; echo; echo "Commit ${GITHUB_SHA::8}."; } >comment.md
                if [ -n "$id" ]; then
                  gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md >/dev/null
                else
                  gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md >/dev/null
                fi
              fi
            fi
          done
          if [ -n "$slower" ]; then
            echo "::error title=pBench::the graphics got significantly slower than tools/pBench/ci-baselines in:$slower (see the summary)"
            exit 1
          fi

      # What the baselines in the repository are made from when they have to
      # be made again: see doc/pbench.txt.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pbench-results
          path: results/
          retention-days: 14

  # A single job to require in the branch protection rules, so that the list
  # does not have to be edited every time a configuration is added.
  all-builds:
    name: All builds
    needs: [build, build-atari, x86_64, regression, shared-pexec, release-archives, raspi-sdcard, homebrew]
    # Runs even when a configuration failed, which is the whole point, but not
    # when the run was cancelled: superseding a pull request run is normal, and
    # reporting the leftover as a failed build is just misleading.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # (for tools/check-duplicate-configs.py, which check-ci-configs.sh runs)
      - name: Install kconfiglib
        run: |
          python3 -m venv /tmp/kconfig-venv
          /tmp/kconfig-venv/bin/pip install --disable-pip-version-check kconfiglib==14.1.0

      # The matrices are not worked out from configs/ (a job of its own for
      # a list that rarely changes): this fails when a configuration is not
      # in .github/ci-configs or the x86_64 matrix, so that none is left out,
      # or when two configurations make the same .config (#989).
      - name: Check that every configuration is built
        run: PATH=/tmp/kconfig-venv/bin:$PATH tools/check-ci-configs.sh

      - name: Check the results
        if: ${{ !cancelled() }}
        run: |
          echo "m68k and arm builds:   ${{ needs.build.result }}"
          echo "Atari builds:          ${{ needs.build-atari.result }}"
          echo "x86_64 configurations: ${{ needs.x86_64.result }}"
          echo "regression suite:      ${{ needs.regression.result }}"
          echo "positive shared Pexec: ${{ needs.shared-pexec.result }}"
          echo "release archives:      ${{ needs.release-archives.result }}"
          echo "raspi SD card image:   ${{ needs.raspi-sdcard.result }}"
          echo "Homebrew SDKs/builds:  ${{ needs.homebrew.result }}"

          ok=true
          [ '${{ needs.build.result }}' = success ] || ok=false
          [ '${{ needs.build-atari.result }}' = success ] || ok=false
          [ '${{ needs.x86_64.result }}' = success ] || ok=false
          [ '${{ needs.regression.result }}' = success ] || ok=false
          [ '${{ needs.shared-pexec.result }}' = success ] || ok=false
          [ '${{ needs.release-archives.result }}' = success ] || ok=false
          [ '${{ needs.raspi-sdcard.result }}' = success ] || ok=false
          [ '${{ needs.homebrew.result }}' = success ] || ok=false

          if ! $ok; then
            echo "::error::at least one required job failed (configuration build, regression suite, release archives or SD card image): see the results above"
            exit 1
          fi
