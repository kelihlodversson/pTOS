#
# Ordinary build validation for pTOS.
#
# Every configuration in configs/ is built on its own, so that a change to
# shared code that breaks one machine says which machine it broke.  The m68k
# release archives are built too, because "make release" exercises code paths
# (all countries, the source archive, EmuCON) that a single image build does
# not.
#
# Publishing releases is deliberately not part of this workflow; see
# release.yml.
#

name: Build

# "epic/**" branches are long-lived integration branches for a multi-PR
# body of work (e.g. epic/329-x32-port): sub-issue PRs target one of these
# instead of master while the work is in progress, so they need the same
# CI coverage master's own PRs get, not just validation once the epic
# branch eventually merges to master.
on:
  push:
    branches: [master, "epic/**"]
  pull_request:
    branches: [master, "epic/**"]
  workflow_dispatch:

# Superseded runs of a pull request are of no interest.  Runs on master are
# left alone, so that every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  elf-shared-core:
    name: x32 ELF shared-library metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install host and x32 test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
          sudo apt-get install -y qemu-system-x86 ovmf dosfstools mtools
          python3 -m venv /tmp/elf-shared-venv
          /tmp/elf-shared-venv/bin/pip install kconfiglib==14.1.0
      - name: Test metadata, corrupt inputs and Kconfig isolation
        run: /tmp/elf-shared-venv/bin/python tools/test-elf-shared.py
      - name: Build the enabled freestanding x32 core
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          make pc-x86_64_defconfig
          CONFIG_= python - <<'PY'
          import kconfiglib
          config = kconfiglib.Kconfig()
          config.load_config()
          config.syms["CONF_WITH_ELF_SHARED"].set_value(2)
          config.write_config()
          PY
          make CROSS_COMPILE= obj/ldso/libldso.a
          ld -m elf32_x86_64 -r obj/ldso/dynamic.o obj/ldso/relocate.o obj/ldso/backend.o -o /tmp/ldso-core.o
          test -z "$(nm -u /tmp/ldso-core.o)"
      - name: Build and boot-test enabled mapping syscalls
        run: |
          export PATH=/tmp/elf-shared-venv/bin:$PATH
          make CROSS_COMPILE= -j2
          make CROSS_COMPILE= x32test
          sh tools/test-mmap-boot.sh

  # The matrices are derived from configs/ instead of being written out here,
  # so that adding a configuration automatically makes it a compatibility
  # check without anyone having to remember this file.
  configurations:
    name: Enumerate configurations
    runs-on: ubuntu-latest
    outputs:
      m68k: ${{ steps.enumerate.outputs.m68k }}
      arm: ${{ steps.enumerate.outputs.arm }}
      x86_64: ${{ steps.enumerate.outputs.x86_64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Split the configurations by architecture
        id: enumerate
        run: |
          # ["rpi1","rpi2"] from a space separated list, [] when it is empty.
          # Written out by hand rather than with jq, so that this job needs
          # nothing beyond the shell.  A defconfig name never needs escaping.
          to_json() {
            local out= sep=
            for name in $1; do
              out="$out$sep\"$name\""
              sep=,
            done
            printf '[%s]' "$out"
          }

          m68k=
          arm=
          x86_64=
          for config in configs/*_defconfig; do
            name=$(basename "$config" _defconfig)
            # MACHINE_RPI or MACHINE_VIRT_ARM is what selects the ARM
            # architecture, MACHINE_PC_X86_64 the x86-64 one; everything
            # else in configs/ is m68k or ColdFire.
            if grep -qE '^MACHINE_(RPI|VIRT_ARM)=y' "$config"; then
              arm="$arm $name"
            elif grep -qE '^MACHINE_PC_X86_64=y' "$config"; then
              x86_64="$x86_64 $name"
            else
              m68k="$m68k $name"
            fi
          done

          # One JSON array per architecture, for the matrices below.
          echo "m68k=$(to_json "$m68k")" >>"$GITHUB_OUTPUT"
          echo "arm=$(to_json "$arm")" >>"$GITHUB_OUTPUT"
          echo "x86_64=$(to_json "$x86_64")" >>"$GITHUB_OUTPUT"

          {
            echo '## Configurations to build'
            echo
            echo "m68k:$m68k"
            echo
            echo "arm:$arm"
            echo
            echo "x86_64:$x86_64"
          } >>"$GITHUB_STEP_SUMMARY"

  m68k:
    # The configuration name is the job name, so a failure is identified by
    # the entry in the checks list, without opening any logs.
    name: ${{ matrix.config }}
    needs: configurations
    runs-on: ubuntu-latest
    strategy:
      # Every configuration is an independent compatibility check, so one
      # failure must not hide the state of the others.
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.configurations.outputs.m68k) }}
    steps:
      # the configurations with CONF_WITH_VDI_SCALABLE_FONTS build lib/freetype
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      - name: Build ${{ matrix.config }}
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          set -o pipefail   # tee below must not hide a failing make
          # Kconfig warns about a discarded assignment only here, so the
          # log starts with the defconfig
          make "${CONFIG}_defconfig" 2>&1 | tee build.log
          make 2>&1 | tee -a build.log
          # every configuration builds without warnings (#584): keep it so
          tools/check-build-warnings.sh build.log

      - name: Collect the build products
        run: |
          mkdir products
          # The name of the image depends on the configuration, so take
          # whatever the build produced rather than guessing.
          for product in *.img *.prg *.st *.s19 *.stc *.rom *.adf *.sym emutos.map; do
            if [ -e "$product" ]; then
              cp "$product" products/
            fi
          done
          ls -l products

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-${{ matrix.config }}
          path: products/
          retention-days: 14

      - name: Report the failure
        if: failure()
        run: |
          echo "::error title=${{ matrix.config }}::the ${{ matrix.config }} configuration failed"

  arm:
    name: ${{ matrix.config }}
    needs: configurations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.configurations.outputs.arm) }}
    steps:
      # the configurations with CONF_WITH_VDI_SCALABLE_FONTS build lib/freetype
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: arm

      - name: Build ${{ matrix.config }}
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          set -o pipefail   # tee below must not hide a failing make
          # Kconfig warns about a discarded assignment only here, so the
          # log starts with the defconfig
          make "${CONFIG}_defconfig" 2>&1 | tee build.log
          make 2>&1 | tee -a build.log
          # every configuration builds without warnings (#584): keep it so
          tools/check-build-warnings.sh build.log

      - name: Collect the build products
        run: |
          mkdir products
          # kernel.img, kernel7.img, kernel8-32.img or kernel7l.img, plus the
          # ELF the image was extracted from, which still has the symbols.
          for product in *.img emutos.elf emutos.map; do
            if [ -e "$product" ]; then
              cp "$product" products/
            fi
          done
          ls -l products

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-${{ matrix.config }}
          path: products/
          retention-days: 14

      - name: Report the failure
        if: failure()
        run: |
          echo "::error title=${{ matrix.config }}::the ${{ matrix.config }} configuration failed"

  x86_64:
    name: ${{ matrix.config }}
    needs: configurations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(needs.configurations.outputs.x86_64) }}
    steps:
      # the configurations with CONF_WITH_VDI_SCALABLE_FONTS build lib/freetype
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: x86_64

      - name: Build ${{ matrix.config }}
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          set -o pipefail   # tee below must not hide a failing make
          # Kconfig warns about a discarded assignment only here, so the
          # log starts with the defconfig
          make "${CONFIG}_defconfig" 2>&1 | tee build.log
          # CI deliberately uses Ubuntu's native gcc/binutils instead of the
          # x86_64-elf- cross toolchain selected by the developer default.
          make CROSS_COMPILE= 2>&1 | tee -a build.log
          tools/check-build-warnings.sh build.log

      - name: Collect the build products
        run: |
          mkdir products
          # The PE32+ EFI application, plus the map file with its symbols.
          for product in *.efi emutos.map; do
            if [ -e "$product" ]; then
              cp "$product" products/
            fi
          done
          ls -l products

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-${{ matrix.config }}
          path: products/
          retention-days: 14

      # A build that links is not a build that boots: without this, a
      # regression in the boot path, the trap-dispatch/machine-hook layer,
      # or the exception/panic path would still show as a green job, since
      # nothing above actually runs the image. Only pc-x86_64 boots this
      # way (EFI/OVMF); a future non-EFI x86-64 config would need its own
      # check instead of this one.
      - name: Install QEMU and OVMF for the boot test
        if: matrix.config == 'pc-x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 ovmf

      # Booted the same way ptos-smoketest documents: a synthesized FAT ESP
      # directory (QEMU's fat: driver), OVMF firmware, -machine pc (legacy
      # IDE, which OVMF's boot manager auto-discovers the ESP through --
      # q35/AHCI needs more setup, not verified here). This deliberately
      # keeps the default EmuCON image headless; the separate GOP/AES
      # desktop smoke test is visual. -cpu qemu64,+pdpe1gb is required: the physical-memory
      # direct map needs 1 GiB pages (#344), which QEMU's default qemu64
      # CPU model does not advertise on its own.
      #
      # pTOS never exits on its own once it reaches the shell -- it waits
      # for keyboard input forever -- so `timeout` is expected to be what
      # ends the process, not a status. That is why the exit code is
      # checked explicitly instead of just letting the step fail or
      # succeed on it: 124 means the timeout fired (the normal case here),
      # anything else means QEMU itself exited unexpectedly.
      - name: Boot-test under QEMU/OVMF
        if: matrix.config == 'pc-x86_64'
        run: |
          mkdir -p esp/EFI/BOOT
          cp pc-x86_64.efi esp/EFI/BOOT/BOOTX64.EFI
          # a real x32 ELF on the boot drive: the self-test runs it through
          # Pexec() from a ring-3 process (nested launch), as EmuCON does
          make CROSS_COMPILE= x32test
          cp x32hello.elf esp/X32HELLO.TOS
          # the same program linked for another address, which Pexec() has to
          # move into the image window and relocate
          cp x32reloc.elf esp/X32RELOC.TOS
          # ... and one linked for another address without relocations, which
          # must be refused
          cp x32noreloc.elf esp/X32NOREL.TOS
          # ... and one with a 6 MiB bss, loaded by PE_LOAD straight into the
          # caller's heap
          cp x32big.elf esp/X32BIG.TOS
          # ... and one cut short, whose loading fails halfway
          head -c 2000 x32hello.elf > esp/X32TRUNC.TOS
          cp /usr/share/OVMF/OVMF_VARS_4M.fd .

          set +e
          timeout 60 qemu-system-x86_64 -machine pc -m 256 -cpu qemu64,+pdpe1gb \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=OVMF_VARS_4M.fd \
            -drive format=raw,file=fat:rw:esp \
            -serial file:boot.log -display none
          qemu_exit=$?
          set -e

          echo "::group::Serial console log"
          cat boot.log
          echo "::endgroup::"

          if [ "$qemu_exit" != 124 ]; then
            echo "::error::qemu-system-x86_64 exited with code $qemu_exit instead of running until the timeout killed it -- that means it never reached the shell (where it would otherwise wait for input forever)"
            exit 1
          fi

          # A triple fault (a page-table, GDT/IDT or ABI bug) makes OVMF
          # silently reset the VM and retry, which shows up as the boot
          # progress lines repeating -- so exactly one attempt is part of
          # the pass signal, not just "did it get far enough".
          entries=$(grep -c 'EFI entry reached' boot.log || true)
          if [ "$entries" != 1 ]; then
            echo "::error::expected exactly one 'EFI entry reached' line, found $entries -- likely a reset/triple-fault loop"
            exit 1
          fi

          if grep -q '^panic:' boot.log; then
            echo "::error::the kernel panicked during boot"
            exit 1
          fi

          # The memory-management self-test (bios/machine/pc-x86_64/memtest.c,
          # #362) repeats process create/exit and injected-failure cycles
          # and requires every allocator to return to its starting state:
          # a leaked mapping, page-table or backing page, KPROC record or
          # kernel-heap block fails it.
          if grep -q 'x86-64 memtest: FAIL' boot.log; then
            echo "::error::the boot-time memory-management self-test failed"
            exit 1
          fi
          if ! grep -q 'x86-64 memtest: PASS' boot.log; then
            echo "::error::the boot-time memory-management self-test never reported PASS"
            exit 1
          fi

          # The self-test also launches real ring-3 x32 processes
          # (tests/x32_probe/): entry state and selectors, a GEMDOS call
          # across the syscall boundary, fault containment, private pages.
          # Its deliberate faults print "process fault:" lines BEFORE the
          # PASS line; any such line after it is the built-in EmuCON itself
          # faulting.
          if sed -n '/x86-64 memtest: PASS/,$p' boot.log | grep -q 'process fault:'; then
            echo "::error::the ring-3 EmuCON faulted"
            exit 1
          fi

          if ! grep -q 'x86-64 nested pexec: PASS' boot.log; then
            echo "::error::a ring-3 process could not run a child through Pexec() and resume"
            exit 1
          fi

          if ! grep -q 'x86-64 private heap: PASS' boot.log; then
            echo "::error::a loaded x32 program could not use its private Malloc() memory"
            exit 1
          fi

          if ! grep -q 'x86-64 private image: PASS' boot.log; then
            echo "::error::a new process did not get its image in the image window"
            exit 1
          fi

          if ! grep -q 'x86-64 unaligned relocation: PASS' boot.log; then
            echo "::error::a program linked for another address was not relocated correctly"
            exit 1
          fi

          if ! grep -q 'x86-64 pexec go gives back: PASS' boot.log; then
            echo "::error::PE_GO did not give the loaded program's pages back"
            exit 1
          fi

          if ! grep -q 'x86-64 pexec go gives back with a gap: PASS' boot.log; then
            echo "::error::PE_GO did not find the loaded program's pages after the child allocated below them"
            exit 1
          fi

          if ! grep -q 'x86-64 psetlimit: PASS' boot.log; then
            echo "::error::Psetlimit did not set, report or pass on the limits and the stack size"
            exit 1
          fi

          if ! grep -q 'x86-64 demand paging: PASS' boot.log; then
            echo "::error::a process's Malloc() memory and stack were not backed on first touch"
            exit 1
          fi

          if ! grep -q 'x86-64 pexec load big: PASS' boot.log; then
            echo "::error::PE_LOAD did not take a program bigger than the image window"
            exit 1
          fi

          if ! grep -q 'x86-64 pexec truncated: PASS' boot.log; then
            echo "::error::a failed load did not leave the loader in its own address space"
            exit 1
          fi

          if ! grep -q 'x86-64 ancestors: PASS' boot.log; then
            echo "::error::a ring-3 grandchild did not see its ancestors' basepages"
            exit 1
          fi

          if ! grep -q 'x86-64 nested fault: PASS' boot.log; then
            echo "::error::a ring-3 process did not survive its child's fault and resume"
            exit 1
          fi

          if ! grep -q 'x86-64 nested ptermres: PASS' boot.log; then
            echo "::error::a ring-3 process could not keep launching children that stay resident"
            exit 1
          fi

          # EmuCON is an x32 program run in ring 3 -- not linked into the
          # kernel -- so its banner can only come from that process.
          if ! grep -q 'EmuCON: starting the x32 image in ring 3' boot.log; then
            echo "::error::the kernel never started the ring-3 EmuCON"
            exit 1
          fi
          if ! grep -q 'Welcome to EmuCON2' boot.log; then
            echo "::error::never reached the EmuCON2 shell prompt"
            exit 1
          fi

          echo "Boot test passed: reached the ring-3 EmuCON2 shell, no reset loop, no panic."

      - name: Report the failure
        if: failure()
        run: |
          echo "::error title=${{ matrix.config }}::the ${{ matrix.config }} configuration failed"

  # The regression suite (tests/, `make test-dir`) run under QEMU.  The virt
  # machines are built without the AES (the *-cli configurations) so that
  # they boot to EmuCON, where tools/run-regression-tests.sh types the name
  # of the suite into the serial console; pc-x86_64 boots to EmuCON anyway
  # and is typed into through the QEMU monitor.  See tests/readme.md.
  regression:
    name: regression (${{ matrix.machine }})
    needs: configurations
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: virt-arm
            config: virt-arm-cli
            arch: arm
            runner: ubuntu-latest
            qemu: qemu-system-arm
            make_args: ''
          # a Raspberry Pi 2 with the desktop: the AES, the chunky 16 bit
          # screen of the Pi's framebuffer.  The desktop starts the suite
          # (tests/emudesk.inf) and the console is on the UART as well
          # (rpi2-test_defconfig), where the script reads the verdict; no
          # shutdown checks, which type into EmuCON
          - machine: raspi2b
            config: rpi2-test
            arch: arm
            runner: ubuntu-latest
            qemu: qemu-system-arm
            make_args: ''
          - machine: virt-m68k
            config: virt-m68k-cli-elf
            arch: m68k
            runner: ubuntu-latest
            qemu: qemu-system-misc
            make_args: ''
          # the register-argument calling convention (-mfastcall): the VDI's scalable fonts call
          # FreeType on a stack of its own, which it has to survive
          - machine: virt-m68k-fastcall
            script_machine: virt-m68k
            config: virt-m68k-cli-fastcall
            arch: m68k
            runner: ubuntu-latest
            qemu: qemu-system-misc
            make_args: ''
          - machine: pc-x86_64
            config: pc-x86_64
            arch: x86_64
            runner: ubuntu-latest
            qemu: qemu-system-x86 ovmf
            # native gcc, as in the x86_64 build job above
            make_args: CROSS_COMPILE=
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: ${{ matrix.arch }}

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ${{ matrix.qemu }}
          # scalable fonts for the gdos_answer suite: TrueType and CFF, one
          # whose ascender is taller than its em (Loma), and a monospaced one
          # with marks of no width (Liberation Mono); fontTools makes a TrueType
          # collection of two Liberation Sans faces
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-inter fonts-tlwg-loma-otf \
              fonts-liberation
          # for the interpreter the test script runs (setup-toolchain
          # selects its own Python, which the system's packages are not for)
          python3 -m pip install fonttools

      - name: Build the kernel and the test programs
        env:
          CONFIG: ${{ matrix.config }}
          MAKE_ARGS: ${{ matrix.make_args }}
        run: |
          make "${CONFIG}_defconfig"
          make $MAKE_ARGS
          make $MAKE_ARGS test-dir

      - name: Run the regression suite
        run: tools/run-regression-tests.sh ${{ matrix.script_machine || matrix.machine }}

      - name: Report the failure
        if: failure()
        run: |
          echo "::error title=regression (${{ matrix.machine }})::the regression suite failed on ${{ matrix.machine }}"

  release-archives:
    name: Release archives
    runs-on: ubuntu-latest
    steps:
      # release-emucon (part of "make release") builds against the
      # lib/libcmini submodule.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      # Not a release: these archives are only kept as workflow artifacts, to
      # confirm that "make release" still works and to have something to
      # download from a build of master.  release.yml is what publishes.
      - name: Build the release archives
        run: |
          VERSION="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION"
          make release VERSION="$VERSION"
          ls -l release-archives

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-release-archives
          path: release-archives/
          retention-days: 14

  raspi-sdcard:
    name: Raspberry Pi SD card image
    needs: [arm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The kernel images the arm matrix above already built for rpi1-4 --
      # rebuilding them here too would just double the wait.  rpi2-sparse is
      # a VDI test variant of rpi2, not part of the SD card; the pattern's
      # single-digit character class excludes it (and the virt-arm ones,
      # which are QEMU-only and have no kernel*.img at all).
      - name: Collect the rpi1-4 kernel images
        uses: actions/download-artifact@v4
        with:
          pattern: ptos-rpi[1-4]
          merge-multiple: true
          path: raspi-build

      # mtools/dosfstools build the FAT16 partition and fdisk provides sfdisk
      # for the MBR, both without ever mounting or loop-attaching anything --
      # see tools/mkraspi-image.sh.  dos2unix provides unix2dos, which "make
      # release-raspi-resources" uses on the bundled text files, same as
      # every other pTOS release archive.  curl is what
      # tools/fetch-raspi-firmware.sh and tools/fetch-fonts.sh download with, listed explicitly
      # rather than assumed from the runner image.
      - name: Install SD card image tooling
        run: sudo apt-get update && sudo apt-get install -y mtools dosfstools fdisk dos2unix curl zip

      - name: Fetch the Raspberry Pi boot firmware
        run: ./tools/fetch-raspi-firmware.sh sdcard/raspi-firmware

      # Not a release, so no version tag: a snapshot string identifies the
      # commit this artifact was built from, same as release-archives above.
      - name: Assemble the SD card contents
        run: |
          VERSION="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "VERSION=$VERSION"
          archive="ptos-raspi-$VERSION"
          mkdir -p "sdcard/$archive"

          cp raspi-build/kernel*.img "sdcard/$archive"/
          cp sdcard/raspi-firmware/* "sdcard/$archive"/
          rm -r sdcard/raspi-firmware

          # The loadable mouse cursor and desktop icon resources, and a
          # readme.txt plus a doc/ subset -- the same optional extras every
          # other pTOS release archive carries, from release.mk.
          make release-raspi-resources DEST="sdcard/$archive"

          # The default scalable fonts (DejaVu, with their licence), which
          # the built-in GDOS finds in \GEMSYS\FONTS on the boot drive
          # without any configuration: tools/fetch-fonts.sh, pinned and
          # checked by checksum like the boot firmware.
          ./tools/fetch-fonts.sh "sdcard/$archive/GEMSYS/FONTS"

          ./tools/mkraspi-image.sh "sdcard/$archive" "sdcard/$archive.img"

          cd sdcard
          zip -9 -r "$archive.zip" "$archive" && rm -r "$archive"
          zip -9 "$archive.img.zip" "$archive.img" && rm "$archive.img"
          ls -l .

      - uses: actions/upload-artifact@v4
        with:
          name: ptos-raspi-sdcard
          path: sdcard/
          retention-days: 14

  # A single job to require in the branch protection rules, so that the list
  # does not have to be edited every time a configuration is added.
  all-builds:
    name: All builds
    needs: [configurations, m68k, arm, x86_64, regression, release-archives, raspi-sdcard]
    # Runs even when a configuration failed, which is the whole point, but not
    # when the run was cancelled: superseding a pull request run is normal, and
    # reporting the leftover as a failed build is just misleading.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the results
        run: |
          echo "m68k configurations:   ${{ needs.m68k.result }}"
          echo "arm configurations:    ${{ needs.arm.result }}"
          echo "x86_64 configurations: ${{ needs.x86_64.result }}"
          echo "regression suite:      ${{ needs.regression.result }}"
          echo "release archives:      ${{ needs.release-archives.result }}"
          echo "raspi SD card image:   ${{ needs.raspi-sdcard.result }}"

          ok=true
          [ '${{ needs.m68k.result }}' = success ] || ok=false
          [ '${{ needs.arm.result }}' = success ] || ok=false
          # A matrix with no configurations (no MACHINE_PC_X86_64=y defconfig
          # exists yet on this branch) generates no x86_64 job at all, and
          # GitHub then reports needs.x86_64.result as "failure" rather than
          # "skipped" -- so the x86_64 job's result only counts when its
          # matrix was actually non-empty.
          if [ '${{ needs.configurations.outputs.x86_64 }}' != '[]' ]; then
            [ '${{ needs.x86_64.result }}' = success ] || ok=false
          fi
          [ '${{ needs.regression.result }}' = success ] || ok=false
          [ '${{ needs.release-archives.result }}' = success ] || ok=false
          [ '${{ needs.raspi-sdcard.result }}' = success ] || ok=false

          if ! $ok; then
            echo "::error::at least one required job failed (configuration build, regression suite, release archives or SD card image): see the results above"
            exit 1
          fi
