#
# Performance check for pTOS: runs pBench (tools/pBench, doc/pbench.txt) under
# Hatari and compares the result with the baseline kept in the repository.
#
# A change that makes the graphics significantly slower fails the check; one
# that makes them significantly faster gets a comment on the pull request, so
# that the improvement is noticed and the baseline moved up on purpose.
#
# Only Hatari is used: its clock is the emulated one, so the numbers do not
# depend on the runner (QEMU's do).
#

name: pBench

# "epic/**": pull requests to a long-lived integration branch are measured
# too, as the Build workflow does.
on:
  pull_request:
    branches: [master, "epic/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The key of the baselines in tools/pBench/ci-baselines is the name of
        # the configuration.  atari256 and atari512-fastcall are built with
        # -mfastcall.
        include:
          - config: atari512
            image: ptos512k.img
          - config: atari256
            image: ptos256us.img
          # the 512 KB image of the TT and the Falcon built with -mfastcall
          - config: atari512-fastcall
            image: ptos512k.img
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      - name: Build the system and pBench
        run: |
          make "${{ matrix.config }}_defconfig"
          make
          make pbench.prg
          mkdir products
          cp ${{ matrix.image }} products/system.img
          cp pbench.prg products/

      - uses: actions/upload-artifact@v4
        with:
          name: pbench-${{ matrix.config }}
          path: products/
          retention-days: 7

  measure:
    name: Measure ${{ matrix.config }}
    needs: build
    # Hatari comes from the distribution's packages, which the 22.04 of the
    # build's runner has an old version of.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The screen modes (see run-baselines.py --res): the ST modes of
        # every configuration, and an emulated Falcon with a 68030 and with
        # a 68040 for the one whose ROM image runs on it.
        include:
          - config: atari512
            modes: low,med,high,f030,f040
          - config: atari256
            modes: low,med,high
          - config: atari512-fastcall
            modes: f030,f040
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pbench-${{ matrix.config }}
          path: products

      - name: Install Hatari
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hatari
          hatari --version || true     # (it exits with 1)

      # A mode that gave no result is reported by the comparison below, which
      # still has to run (and fails the job) so that the report, the summary
      # and the comment are not lost
      - name: Run pBench in every screen mode, with and without blitter
        continue-on-error: true
        # A run takes half a minute; one that hangs is given
        # two minutes, three tries, in two waves of five: well below the job's
        # 25 minutes, which would cancel the reporting steps too.
        timeout-minutes: 15
        env:
          CONFIG: ${{ matrix.config }}
          MODES: ${{ matrix.modes }}
        run: |
          python3 tools/pBench/run-baselines.py \
            --pbench products/pbench.prg --out results --jobs 5 --timeout 120 \
            --res "$MODES" \
            --system "${CONFIG}=products/system.img=pTOS ${CONFIG} (${GITHUB_SHA::8})"

      # The results as text too, so that baselines can be made from the log
      # when the artifact cannot be had (no -mfastcall toolchain to make them
      # with locally either)
      - name: Show the results
        if: always()
        run: |
          for f in results/*.txt; do
            # no match leaves the pattern itself: nothing to show then, and
            # the comparison below reports the missing results
            [ -e "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      # What the baselines in the repository are made from when they have to
      # be made again: see doc/pbench.txt.
      - uses: actions/upload-artifact@v4
        with:
          name: pbench-results-${{ matrix.config }}
          path: results/
          retention-days: 14

      - name: Compare with the baseline
        id: compare
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          rc=0
          python3 tools/pBench/check-baseline.py --report report.md \
            tools/pBench/ci-baselines results "$CONFIG" || rc=$?
          cat report.md >>"$GITHUB_STEP_SUMMARY"
          # 0 as the baseline, 1 slower (or no result), 2 faster
          echo "status=$rc" >>"$GITHUB_OUTPUT"

      # Update the comment this job made on an earlier push, or make one when
      # there is something to say: a significant change, in either direction.
      # A pull request from a fork has a read-only token, so there the
      # summary above is all there is.
      - name: Comment on the pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CONFIG: ${{ matrix.config }}
          STATUS: ${{ steps.compare.outputs.status }}
        run: |
          marker="<!-- pbench-check:${CONFIG} -->"
          id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                 --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
          if [ -z "$id" ] && [ "$STATUS" = 0 ]; then
            exit 0
          fi
          { echo "$marker"; cat report.md; echo; echo "Commit ${GITHUB_SHA::8}."; } >comment.md
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md >/dev/null
          fi

      - name: Fail on a slowdown
        if: steps.compare.outputs.status == '1'
        run: |
          echo "::error title=pBench::the graphics got significantly slower than tools/pBench/ci-baselines (see the summary)"
          exit 1
