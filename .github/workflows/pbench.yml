#
# Performance check for pTOS: runs pBench (tools/pBench, doc/pbench.txt) under
# Hatari and compares the result with the baseline kept in the repository.
#
# A change that makes the graphics significantly slower fails the check; one
# that makes them significantly faster gets a comment on the pull request, so
# that the improvement is noticed and the baseline moved up on purpose.
#
# Only Hatari is used: its clock is the emulated one, so the numbers do not
# depend on the runner (QEMU's do).
#

name: pBench

# "epic/**": pull requests to a long-lived integration branch are measured
# too, as the Build workflow does.
on:
  pull_request:
    branches: [master, "epic/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One job: the three configurations are built (a minute or so each) and
  # measured one after the other.  Each is its own check: it is compared with
  # its own baseline, has its own comment on the pull request, and a
  # significant slowdown of any of them fails the job at the end.  Hatari
  # comes from the distribution's packages: the runner is an Ubuntu 26.04, for
  # its Hatari 2.6, the same as the Hatari tests run with (the baselines are
  # made with it).
  pbench:
    name: pBench
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      - name: Install Hatari
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hatari
          hatari --version || true     # (it exits with 1)

      # The key of the baselines in tools/pBench/ci-baselines is the name of
      # the configuration.  atari256 and atari512-fastcall are built with
      # -mfastcall (atari512-fastcall: the 512 KB image of the TT and the
      # Falcon).
      - name: Build the systems and pBench
        run: |
          mkdir products
          for entry in atari512:ptos512k.img atari256:ptos256us.img atari512-fastcall:ptos512k.img; do
            config=${entry%%:*}
            image=${entry#*:}
            make distclean >/dev/null 2>&1
            make "${config}_defconfig"
            make
            make pbench.prg
            mkdir "products/$config"
            cp "$image" "products/$config/system.img"
            cp pbench.prg "products/$config/"
          done

      # A mode that gave no result is reported by the comparison, which still
      # has to run (and fail the job) so that the report, the summary and the
      # comment are not lost.  A run takes half a minute; one that hangs is
      # given two minutes, three tries, in two waves of five.  The screen
      # modes (see run-baselines.py --res): the ST modes of every
      # configuration, and an emulated Falcon with a 68030 and with a 68040
      # for the one whose ROM image runs on it.
      - name: Measure and compare
        id: measure
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          # a pull request from a fork has a read-only token, so there the
          # summary is all there is
          CAN_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          slower=
          for entry in atari512:low,med,high,f030,f040 atari256:low,med,high atari512-fastcall:f030,f040; do
            config=${entry%%:*}
            modes=${entry#*:}
            echo "::group::$config"
            python3 tools/pBench/run-baselines.py \
              --pbench "products/$config/pbench.prg" --out results --jobs 5 --timeout 120 \
              --res "$modes" \
              --system "${config}=products/$config/system.img=pTOS ${config} (${GITHUB_SHA::8})" || true
            # The results as text too, so that baselines can be made from the
            # log when the artifact cannot be had (no -mfastcall toolchain to
            # make them with locally either)
            for f in results/${config}-*.txt; do
              [ -e "$f" ] || continue
              echo "== $f"
              cat "$f"
            done
            echo "::endgroup::"

            # 0 as the baseline, 1 slower (or no result), 2 faster
            rc=0
            python3 tools/pBench/check-baseline.py --report "report-$config.md" \
              tools/pBench/ci-baselines results "$config" || rc=$?
            cat "report-$config.md" >>"$GITHUB_STEP_SUMMARY"
            [ "$rc" != 1 ] || slower="$slower $config"

            # Update the comment this job made on an earlier push, or make one
            # when there is something to say: a significant change, in either
            # direction.
            if [ "$CAN_COMMENT" = true ]; then
              marker="<!-- pbench-check:${config} -->"
              id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
                     --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)
              if [ -n "$id" ] || [ "$rc" != 0 ]; then
                { echo "$marker"; cat "report-$config.md"; echo; echo "Commit ${GITHUB_SHA::8}."; } >comment.md
                if [ -n "$id" ]; then
                  gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -F body=@comment.md >/dev/null
                else
                  gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@comment.md >/dev/null
                fi
              fi
            fi
          done
          if [ -n "$slower" ]; then
            echo "::error title=pBench::the graphics got significantly slower than tools/pBench/ci-baselines in:$slower (see the summary)"
            exit 1
          fi

      # What the baselines in the repository are made from when they have to
      # be made again: see doc/pbench.txt.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pbench-results
          path: results/
          retention-days: 14
