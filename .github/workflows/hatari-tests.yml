#
# Regression tests under Hatari: runtests.tos (tests/, doc in tests/readme.md)
# on the test disk, on an emulated STE in the three ST screen modes and on an
# emulated Falcon with a 68030 and with a 68040.  The two blitter suites
# (text_blit and raster_copy) compare the blitter with the CPU path pixel by
# pixel, and have to run, not skip themselves, on every one of them; the
# Falcon is the one with a data cache (the blitter paths flush and invalidate
# it, see BLITTER_CACHE_OPS in vdi/vdi_raster.c).
#
# atari512-fastcall is the same image built with -mfastcall, which is the
# only place its code is tested under that calling convention at run time.
#

name: Hatari tests

on:
  pull_request:
    branches: [master, "epic/**"]
  # every configuration in every screen mode, which a pull request does not
  # run (see the matrix of the test job)
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The three configurations one after the other in one job: each is a minute
  # or so, the runner and the toolchain more than that.
  build:
    name: Build the systems and the test disk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      # mkfs.fat and mtools make the test disk (tools/mkhdisk.sh)
      - name: Install the disk image tools
        run: sudo apt-get install -y --no-install-recommends dosfstools mtools

      - name: Build the systems and the test disks
        run: |
          mkdir products
          for config in atari512 atari512-fastcall atari512-extdesk; do
            make distclean >/dev/null 2>&1
            make "${config}_defconfig"
            make
            make test-hd
            mkdir "products/$config"
            cp ptos512k.img "products/$config/system.img"
            cp test-hd.img "products/$config/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: hatari-tests-atari512
          path: products/atari512/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: hatari-tests-atari512-fastcall
          path: products/atari512-fastcall/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: hatari-tests-atari512-extdesk
          path: products/atari512-extdesk/
          retention-days: 7

  test:
    name: Test ${{ matrix.config }}, ${{ matrix.mode }}
    needs: build
    # Hatari comes from the distribution's packages, which the 22.04 of the
    # build's runner has an old version of.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # What a pull request runs is chosen from what depends on the mode
        # and on the kernel (doc/ci.txt); master's nightly run and a manual
        # one go through every combination.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"config":"atari512","mode":"low"},{"config":"atari512","mode":"med"},{"config":"atari512","mode":"high"},{"config":"atari512","mode":"f030"},{"config":"atari512","mode":"f040"},{"config":"atari512-fastcall","mode":"low"},{"config":"atari512-fastcall","mode":"f040"},{"config":"atari512-extdesk","mode":"low"}]'
          || '[{"config":"atari512","mode":"low"},{"config":"atari512","mode":"med"},{"config":"atari512","mode":"high"},{"config":"atari512","mode":"f030"},{"config":"atari512","mode":"f040"},{"config":"atari512-fastcall","mode":"low"},{"config":"atari512-fastcall","mode":"med"},{"config":"atari512-fastcall","mode":"high"},{"config":"atari512-fastcall","mode":"f030"},{"config":"atari512-fastcall","mode":"f040"},{"config":"atari512-extdesk","mode":"low"},{"config":"atari512-extdesk","mode":"med"},{"config":"atari512-extdesk","mode":"high"},{"config":"atari512-extdesk","mode":"f030"},{"config":"atari512-extdesk","mode":"f040"}]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hatari-tests-${{ matrix.config }}
          path: products

      - name: Install Hatari
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hatari
          hatari --version || true     # (it exits with 1)

      # About four minutes; ten is for one that hangs, well below the job's
      # 20 minutes, which would cancel the reporting too
      - name: Run the tests under Hatari
        timeout-minutes: 15
        run: |
          python3 tools/run-hatari-tests.py --tos products/system.img \
            --disk products/test-hd.img --mode "${{ matrix.mode }}" \
            --timeout 600
