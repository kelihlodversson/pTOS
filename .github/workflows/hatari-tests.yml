#
# Regression tests under Hatari: runtests.tos (tests/, doc in tests/readme.md)
# on the test disk, on an emulated STE in the three ST screen modes and on an
# emulated Falcon with a 68030 and with a 68040.  The two blitter suites
# (text_blit and raster_copy) compare the blitter with the CPU path pixel by
# pixel, and have to run, not skip themselves, on every one of them; the
# Falcon is the one with a data cache (the blitter paths flush and invalidate
# it, see BLITTER_CACHE_OPS in vdi/vdi_raster.c).
#
# atari512-fastcall is the same image built with -mfastcall, which is the
# only place its code is tested under that calling convention at run time.
#

name: Hatari tests

on:
  pull_request:
    branches: [master, "epic/**"]
  # every configuration in every screen mode, which a pull request does not
  # run (see the matrix of the test job)
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One job: the three systems are built (a minute or so each, with their test
  # disk), then the tests run several at a time, one Hatari each, on the four
  # CPUs of the runner.  Hatari's clock is the emulated one, so the results do
  # not depend on how busy the runner is.  Hatari comes from the
  # distribution's packages, which the 22.04 of an older runner has an old
  # version of: a 24.04.
  hatari:
    name: Hatari tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      # mkfs.fat and mtools make the test disk (tools/mkhdisk.sh)
      - name: Install Hatari and the disk image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends hatari dosfstools mtools
          hatari --version || true     # (it exits with 1)

      - name: Build the systems and the test disks
        run: |
          mkdir products
          for config in atari512 atari512-fastcall atari512-extdesk; do
            make distclean >/dev/null 2>&1
            make "${config}_defconfig"
            make
            make test-hd
            mkdir "products/$config"
            cp ptos512k.img "products/$config/system.img"
            cp test-hd.img "products/$config/"
          done

      # What a pull request runs is chosen from what depends on the mode and
      # on the kernel (doc/ci.txt); master's nightly run and a manual one go
      # through every combination.  About four minutes each; ten is for one
      # that hangs, well below the job's time.
      - name: Run the tests under Hatari
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            combos="atari512:low atari512:med atari512:high atari512:f030 atari512:f040 atari512-fastcall:low atari512-fastcall:f040 atari512-extdesk:low"
          else
            combos="atari512:low atari512:med atari512:high atari512:f030 atari512:f040 atari512-fastcall:low atari512-fastcall:med atari512-fastcall:high atari512-fastcall:f030 atari512-fastcall:f040 atari512-extdesk:low atari512-extdesk:med atari512-extdesk:high atari512-extdesk:f030 atari512-extdesk:f040"
          fi
          mkdir logs
          run_one() {
            config=${1%:*}
            mode=${1#*:}
            if timeout 900 python3 tools/run-hatari-tests.py \
                 --tos "products/$config/system.img" \
                 --disk "products/$config/test-hd.img" \
                 --mode "$mode" --timeout 600 >"logs/$config-$mode.log" 2>&1; then
              echo ok >"logs/$config-$mode.result"
            else
              echo FAILED >"logs/$config-$mode.result"
            fi
          }
          export -f run_one
          printf '%s\n' $combos | xargs -P "$(nproc)" -I{} bash -c 'run_one {}'

          failed=
          {
            echo "| configuration | mode | result |"
            echo "| --- | --- | --- |"
          } >>"$GITHUB_STEP_SUMMARY"
          for combo in $combos; do
            config=${combo%:*}
            mode=${combo#*:}
            result=$(cat "logs/$config-$mode.result" 2>/dev/null || echo FAILED)
            echo "::group::$config, $mode: $result"
            cat "logs/$config-$mode.log"
            echo "::endgroup::"
            echo "| $config | $mode | $result |" >>"$GITHUB_STEP_SUMMARY"
            if [ "$result" != ok ]; then
              failed="$failed $config,$mode"
              echo "::error title=$config, $mode::the tests failed on $config in the $mode mode"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi
