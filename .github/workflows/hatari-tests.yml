#
# Regression tests under Hatari: runtests.tos (tests/, doc in tests/readme.md)
# on the test disk, on an emulated STE in the three ST screen modes and on an
# emulated Falcon with a 68030 and with a 68040, both with the MMU on (#725);
# falcon-mmu (the Falcon ROM with the kernel in the upper half, #726) runs on
# the 68030 only; falcon-aspace (#727) is that with an address space for every
# process, in its own mode, f030a.  The two blitter suites
# (text_blit and raster_copy) compare the blitter with the CPU path pixel by
# pixel, and have to run, not skip themselves, on every one of them; the
# Falcon is the one with a data cache (the blitter paths flush and invalidate
# it, see BLITTER_CACHE_OPS in vdi/vdi_raster.c).
#
# atari512-fastcall is the same image built with -mfastcall, which is the
# only place its code is tested under that calling convention at run time.
#

name: Hatari tests

on:
  pull_request:
    branches: [master, "epic/**"]
  # a new pin of Hatari builds it and caches it for the pull requests
  push:
    branches: [master, "epic/**"]
    paths:
      - tools/hatari-pin.sh
      - tools/build-hatari.sh
      - tools/patches/hatari-68030-pmove-root.patch
      - .github/actions/setup-hatari/**
  # every configuration in every screen mode, which a pull request does not
  # run (see the matrix of the test job)
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The combinations in groups, a job each (tools/ci-hatari.sh): a run takes
  # from seconds to twenty minutes, and on the four CPUs of one runner they
  # queued for half an hour.  A group of a pull request has at most four, which
  # start at once.  Each job builds the systems its group needs (a minute or so
  # each, with their test disk) and runs them, one Hatari each.  The Hatari is
  # the pinned build of tools/hatari-pin.sh: the 2.4.1 of the 24.04 package
  # hangs the 68030 address-space runs (#727, #737), and the 2.6.1 of the 26.04
  # one lacks the 68030 MMU fixes of 2026 (#805).
  hatari:
    name: Hatari ${{ matrix.group }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # the groups of tools/ci-hatari.sh (its --check compares them)
        group: ${{ fromJSON(github.event_name == 'pull_request' && '["st","variants","mmu"]' || '["st","fastcall","kproc","extdesk","mmu"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      # the Hatari of tools/hatari-pin.sh, built once and cached (#807)
      - uses: ./.github/actions/setup-hatari

      # mkfs.fat and mtools make the test disk (tools/mkhdisk.sh)
      - name: Install the disk image tools
        uses: ./.github/actions/apt-install
        with:
          packages: --no-install-recommends dosfstools mtools

      - name: Report the Hatari version
        run: hatari --version || true     # (it exits with 1)

      # the TT mode reads the screen (tools/run-hatari-tests.py), for the
      # interpreter that setup-toolchain selected
      - name: Install the screen reader of the TT mode
        run: python3 -m pip install pillow

      # A run takes three to eleven minutes on a quiet runner (the 68040 ones
      # are the longest), twice that on a busy one; forty is for one that hangs
      # (#820), well below the job's time.
      - name: Build the systems and run the tests under Hatari
        env:
          EVENT: ${{ github.event_name }}
        run: tools/ci-hatari.sh --group "${{ matrix.group }}"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatari-logs-${{ matrix.group }}
          path: logs/
          if-no-files-found: ignore
          retention-days: 14

  # One check for the branch protection, under the name the single job had,
  # whatever the groups are
  hatari-tests:
    name: Hatari tests
    needs: [hatari]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the groups run every combination once
        run: tools/ci-hatari.sh --check

      - name: Check the results
        run: |
          echo "Hatari groups: ${{ needs.hatari.result }}"
          if [ '${{ needs.hatari.result }}' != success ]; then
            echo "::error::at least one Hatari group failed: see the jobs \"Hatari GROUP\""
            exit 1
          fi
