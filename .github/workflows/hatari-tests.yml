#
# Regression tests under Hatari: runtests.tos (tests/, doc in tests/readme.md)
# on the test disk, on an emulated STE in the three ST screen modes and on an
# emulated Falcon with a 68030 and with a 68040, both with the MMU on (#725).
# The two blitter suites
# (text_blit and raster_copy) compare the blitter with the CPU path pixel by
# pixel, and have to run, not skip themselves, on every one of them; the
# Falcon is the one with a data cache (the blitter paths flush and invalidate
# it, see BLITTER_CACHE_OPS in vdi/vdi_raster.c).
#
# atari512-fastcall is the same image built with -mfastcall, which is the
# only place its code is tested under that calling convention at run time.
#
# falcon-mmu is the Falcon ROM with the kernel in the upper half, running with
# the 68030 MMU on from its first instruction (#726): it is tested on the
# emulated 68030 only.
#
# falcon-aspace is the same ROM with an address space for every process
# (#727): its shell is the test harness (SHELL.TOS on the disk of "make
# test-hd-shell"), which runs in user mode with page tables of its own and
# includes the isolation suite.  It has no VDI, so no blitter suites: mode f030a.
#

name: Hatari tests

on:
  pull_request:
    branches: [master, "epic/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [atari512, atari512-fastcall, atari512-kproc, atari512-extdesk, falcon-mmu, falcon-aspace]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup-toolchain
        with:
          arch: m68k

      # mkfs.fat and mtools make the test disk (tools/mkhdisk.sh)
      - name: Install the disk image tools
        run: sudo apt-get install -y --no-install-recommends dosfstools mtools

      - name: Build the system and the test disk
        run: |
          make "${{ matrix.config }}_defconfig"
          make
          mkdir products
          if [ "${{ matrix.config }}" = falcon-aspace ]; then
              make test-hd-shell      # (the harness is the shell: no console to type into)
              cp test-hd-shell.img products/test-hd.img
          else
              make test-hd
              cp test-hd.img products/
          fi
          cp ptos512k.img products/system.img

      - uses: actions/upload-artifact@v4
        with:
          name: hatari-tests-${{ matrix.config }}
          path: products/
          retention-days: 7

  test:
    name: Test ${{ matrix.config }}, ${{ matrix.mode }}
    needs: build
    # Hatari comes from the distribution's packages, and every mode uses the
    # same one: 2.6 of Ubuntu 26.04, run in a container.  The 2.4.1 of the
    # 24.04 runner hangs the 68030 address-space runs (#727, #737).
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [atari512, atari512-fastcall, atari512-kproc, atari512-extdesk, falcon-mmu, falcon-aspace]
        mode: [low, med, high, f030, f040, f030a]
        # falcon-mmu is the Falcon ROM with the kernel in the upper half and
        # the 68030 MMU on from its first instruction (#726): a 68030 only;
        # falcon-aspace is that with an address space for every process, and
        # runs in its own mode (f030a, #727)
        exclude:
          - {config: falcon-mmu, mode: low}
          - {config: falcon-mmu, mode: med}
          - {config: falcon-mmu, mode: high}
          - {config: falcon-mmu, mode: f040}
          - {config: falcon-mmu, mode: f030a}
          - {config: falcon-aspace, mode: low}
          - {config: falcon-aspace, mode: med}
          - {config: falcon-aspace, mode: high}
          - {config: falcon-aspace, mode: f030}
          - {config: falcon-aspace, mode: f040}
          - {config: atari512, mode: f030a}
          - {config: atari512-fastcall, mode: f030a}
          - {config: atari512-kproc, mode: f030a}
          - {config: atari512-extdesk, mode: f030a}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hatari-tests-${{ matrix.config }}
          path: products

      - name: Install Hatari
        run: |
          SUDO=$(command -v sudo || true)      # (the container is root, without sudo)
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends hatari python3
          hatari --version || true     # (it exits with 1)

      # Four to ten minutes (the Falcon modes run with the MMU on, which makes
      # the 68040 one the slowest); fifteen is for one that hangs, well below
      # the job's 30 minutes, which would cancel the reporting too
      - name: Run the tests under Hatari
        timeout-minutes: 20
        run: |
          python3 tools/run-hatari-tests.py --tos products/system.img \
            --disk products/test-hd.img --mode "${{ matrix.mode }}" \
            --timeout 900
